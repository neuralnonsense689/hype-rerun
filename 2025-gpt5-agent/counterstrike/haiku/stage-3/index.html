<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Strike</title>
    <script type="module" crossorigin src="./assets/index-BD2AoFQj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cw0sdJ0T.css">
  </head>
  <body>
    <div id="app"></div>

    <div id="crosshair">
      <span class="tick top"></span>
      <span class="tick bottom"></span>
      <span class="tick left"></span>
      <span class="tick right"></span>
      <span class="dot"></span>
    </div>

    <div id="hud">
      <div>KILLS <strong id="kills">0</strong></div>
      <div>ENEMIES <strong id="alive">0</strong></div>
    </div>

    <div id="help">
      <kbd>W A S D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sprint &nbsp;
      <kbd>Hold LMB</kbd> fire &nbsp; <kbd>Esc</kbd> pause
    </div>

    <div id="overlay">
      <div class="panel">
        <h1>BLOCK STRIKE</h1>
        <p>Click to play</p>
        <ul>
          <li>Shoot the red enemies until their HP runs out.</li>
          <li>Downed enemies come back after a few seconds.</li>
        </ul>
      </div>
    </div>

  </body>
</html>
