  <path d="M0 705 Q250 693 500 706 T1000 700" fill="none" stroke="#c8c8ae" stroke-width="3"/>
  <ellipse cx="458" cy="739" rx="390" ry="17" fill="#b1b4a6" opacity=".25"/>
