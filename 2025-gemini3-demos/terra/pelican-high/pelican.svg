<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">California brown pelican riding a bicycle</title>
  <desc id="desc">A breeding plumage California brown pelican, with a golden head, white neck, chestnut hindneck, dark pouch and layered brown feathers, pedals a teal bicycle with spoked wheels.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e6f5f3"/><stop offset="1" stop-color="#faf2df"/></linearGradient>
    <linearGradient id="body" x2="0.8" y2="1"><stop stop-color="#b5a89a"/><stop offset="0.48" stop-color="#82766f"/><stop offset="1" stop-color="#514c4b"/></linearGradient>
    <linearGradient id="wing" x2="0.7" y2="1"><stop stop-color="#a99d91"/><stop offset="1" stop-color="#554f4b"/></linearGradient>
    <linearGradient id="pouch" x2="0.3" y2="1"><stop stop-color="#684a47"/><stop offset="1" stop-color="#332d32"/></linearGradient>
    <linearGradient id="head" x2="0" y2="1"><stop stop-color="#f3ce77"/><stop offset="0.45" stop-color="#f2e6c9"/><stop offset="1" stop-color="#d9d5cd"/></linearGradient>
    <g id="wheel">
      <circle r="151" fill="#faf5e9" stroke="#303c3d" stroke-width="13"/>
      <circle r="139" fill="none" stroke="#c6b8a0" stroke-width="4"/>
      <g stroke="#8d9994" stroke-width="2.3">
        <path d="M-139 0H139 M0-139V139 M-120-70L120 70 M-120 70L120-70 M-70-120L70 120 M-70 120L70-120 M-135-36L135 36 M-135 36L135-36 M-36-135L36 135 M-36 135L36-135 M-98-98L98 98 M-98 98L98-98"/>
      </g>
      <circle r="9" fill="#3a4745" stroke="#e1d8c5" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1000" height="780" fill="url(#sky)"/>
