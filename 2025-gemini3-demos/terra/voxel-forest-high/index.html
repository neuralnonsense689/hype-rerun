<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Among the Amber — A forest walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8b4a0;color:#fff;font-family:'DM Sans',sans-serif}canvas{display:block}#scene{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(37,43,34,.36),transparent 27%,transparent 65%,rgba(34,39,30,.4)),linear-gradient(90deg,rgba(34,40,31,.24),transparent 38%)}.top{position:absolute;top:38px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:flex-start}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:38px;height:38px;border:1px solid rgba(255,255,255,.65);display:grid;place-items:center;transform:rotate(45deg)}.brand-icon span{transform:rotate(-45deg);font-size:17px}.brand-name{font-weight:700;font-size:12px;letter-spacing:.2em}.brand-sub{font-size:9px;letter-spacing:.22em;margin-top:5px;opacity:.75}.top-right{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.dot{width:7px;height:7px;background:#e5d2a2;border-radius:50%;box-shadow:0 0 12px #fff0b9}.intro{position:absolute;left:8%;top:24%;max-width:500px;text-shadow:0 2px 24px rgba(45,48,34,.25);pointer-events:none}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:13px}.eyebrow:before{content:'';height:1px;width:32px;background:#fff}.intro h1{font:500 clamp(54px,6.7vw,100px)/.95 'Playfair Display',serif;letter-spacing:-.045em;margin:21px 0 18px}.intro h1 em{font-weight:500}.intro p{font-size:13px;line-height:1.8;letter-spacing:.025em;max-width:280px;color:rgba(255,255,255,.88)}.bottom{position:absolute;bottom:35px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:flex-end}.controls{display:flex;gap:27px;align-items:center}.control{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.88)}.key{height:27px;min-width:27px;border:1px solid rgba(255,255,255,.5);border-radius:4px;display:grid;place-items:center;font-size:10px}.mouse{width:18px;height:25px;border:1px solid rgba(255,255,255,.65);border-radius:9px;position:relative}.mouse:after{content:'';position:absolute;left:8px;top:4px;width:1px;height:6px;background:#fff}.right-bottom{text-align:right}.sound{border:1px solid rgba(255,255,255,.48);background:rgba(40,46,34,.12);color:white;border-radius:50%;height:40px;width:40px;cursor:pointer;font-size:16px;backdrop-filter:blur(4px)}.caption{margin-top:12px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}.center-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;opacity:.85}.center-hint:before{content:'';display:block;width:1px;height:28px;background:rgba(255,255,255,.65);margin:0 auto 12px}.mobile-controls{display:none;position:absolute;bottom:95px;left:24px;gap:8px}.mobile-controls button{border:1px solid #ffffff88;background:#39452c55;color:#fff;border-radius:50%;width:45px;height:45px;font-size:18px;touch-action:none}#loading{position:absolute;inset:0;background:#b3b9a4;display:grid;place-items:center;font:italic 24px 'Playfair Display',serif;transition:opacity .8s;pointer-events:none}.hidden{opacity:0}@media(max-width:700px){.top{top:25px;left:24px;right:24px}.top-right{font-size:8px}.intro{left:7%;top:25%}.intro h1{font-size:58px}.intro p{font-size:12px;max-width:235px}.bottom{left:24px;right:24px;bottom:24px}.controls{display:none}.center-hint{display:none}.mobile-controls{display:flex}.caption{font-size:8px}}
</style>
</head>
<body>
<div id="scene"></div><div class="shade"></div>
<header class="top"><div class="brand"><div class="brand-icon"><span>✳</span></div><div><div class="brand-name">THE QUIET PLACES</div><div class="brand-sub">A LITTLE WORLD TO WANDER</div></div></div><div class="top-right"><span class="dot"></span> AN AUTUMN AFTERNOON</div></header>
<section class="intro"><div class="eyebrow">A moment to yourself</div><h1>Among<br>the <em>amber.</em></h1><p>Take the long way home. There’s nowhere else you need to be.</p></section>
<div class="mobile-controls"><button data-key="a" aria-label="Walk left">←</button><button data-key="w" aria-label="Walk forward">↑</button><button data-key="s" aria-label="Walk backward">↓</button><button data-key="d" aria-label="Walk right">→</button></div>
<footer class="bottom"><div class="controls"><div class="control"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to wander</div><div class="control"><span class="mouse"></span> drag to look around</div></div><div class="center-hint">A little further, always</div><div class="right-bottom"><button class="sound" id="pause" title="Pause walking" aria-label="Pause walking">Ⅱ</button><div class="caption" id="walk-label">Walking slowly</div></div></footer><div id="loading">Finding the quiet...</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const container=document.querySelector('#scene');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xb8c3ae); scene.fog=new THREE.FogExp2(0xb8c3ae,0.027);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,180); camera.position.set(0,2.5,8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.18; container.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffeccc,0x68755a,2)); const sun=new THREE.DirectionalLight(0xffe0ab,2.4); sun.position.set(-18,32,12); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.camera.near=.5;sun.shadow.camera.far=100; sun.shadow.bias=-.0003; scene.add(sun);scene.add(sun.target);
const box=new THREE.BoxGeometry(1,1,1); const mats={}; function mat(c){return mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:1}));}
const colors={ground:['#858e63','#909667','#818c60','#9b9c6a'],path:['#b59d79','#bca781','#aa9774'],trunk:['#665344','#76604a','#5d5040'],leaf:['#bb632f','#ce7835','#d89543','#dfaa57','#a94f2e','#d28239','#e1a454','#b56c37'],grass:['#9c9c5f','#b4a56a','#758657'],stone:['#aaa994','#9b9e88'],mush:['#d9c8a7','#ae6544']};
const size=24, range=2, chunks=new Map(); let seed=1; function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296} function pick(a){return a[Math.floor(random()*a.length)]} function hash(x,z){return (Math.imul(x,374761393)+Math.imul(z,668265263)+1442695041)>>>0}
function makeChunk(cx,cz){seed=hash(cx,cz);const group=new THREE.Group(), batches={}; function add(c,x,y,z,sx,sy,sz){(batches[c]||(batches[c]=[])).push([x,y,z,sx,sy,sz]);} const ox=cx*size,oz=cz*size;
// A continuous earthen trail anchors the wandering forest.
add(pick(colors.ground),ox+size/2,-.25,oz+size/2,size,.5,size); if(cx===-1||cx===0){const l=Math.max(ox,-2.8),r=Math.min(ox+size,2.8);if(r>l)add(pick(colors.path),(l+r)/2,.015,oz+size/2,r-l,.06,size)}
for(let i=0;i<100;i++){let x=ox+random()*size,z=oz+random()*size;let onPath=Math.abs(x)<2.8;if(onPath){if(random()<.55)add(pick(colors.path),x,.055,z,.25+random()*.8,.04,.25+random()*.7);continue} if(random()<.65){let h=.12+random()*.35;add(pick(colors.grass),x,h/2,z,.08,h,.08);if(random()<.25)add(pick(colors.leaf),x+.1,.08,z,.25,.07,.2)}else{add(pick(colors.leaf),x,.04,z,.18+random()*.32,.06,.15+random()*.3)}}
for(let i=0;i<24;i++){let x=ox+random()*size,z=oz+random()*size;if(Math.abs(x)<4.2)continue;let h=5+random()*5, width=.55+random()*.35, trunk=pick(colors.trunk);add(trunk,x,h/2,z,width,h,width); if(random()>.35)add(trunk,x+(random()>.5?1:-1)*.65,h*.65,z,.9,.35,.35);let base=h*.68, crown=2.2+random()*1.1, main=pick(colors.leaf);add(main,x,base+1.1,z,crown*1.5,2.2,crown*1.5);add(pick(colors.leaf),x-.7,base+2.35,z+.15,crown,1.35,crown);add(pick(colors.leaf),x+.75,base+1.45,z-.35,crown*.9,1.5,crown);add(pick(colors.leaf),x+.05,base+3.05,z-.2,crown*.7,.8,crown*.75);if(random()>.5)add(pick(colors.leaf),x-.5,base+.35,z+1,crown*.8,.7,crown*.65)}
for(let i=0;i<8;i++){let x=ox+random()*size,z=oz+random()*size;if(Math.abs(x)<3.2)continue; if(random()>.45){let s=.3+random()*.5;add(pick(colors.stone),x,s*.35,z,s,s*.7,s*.8)}else{add(colors.mush[0],x,.18,z,.1,.36,.1);add(colors.mush[1],x,.39,z,.4,.15,.4)}}
const dummy=new THREE.Object3D();for(const [c,items] of Object.entries(batches)){const mesh=new THREE.InstancedMesh(box,mat(c),items.length);items.forEach((v,i)=>{dummy.position.set(v[0],v[1],v[2]);dummy.scale.set(v[3],v[4],v[5]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)});mesh.receiveShadow=true;mesh.castShadow=c!==colors.ground[0]&&items.length<80;group.add(mesh)}scene.add(group);return group}
function updateChunks(){let cx=Math.floor(camera.position.x/size),cz=Math.floor(camera.position.z/size);for(let x=cx-range;x<=cx+range;x++)for(let z=cz-range;z<=cz+range;z++){let k=x+','+z;if(!chunks.has(k))chunks.set(k,makeChunk(x,z))}for(const [k,g] of chunks){let [x,z]=k.split(',').map(Number);if(Math.abs(x-cx)>range||Math.abs(z-cz)>range){scene.remove(g);g.children.forEach(m=>m.dispose());chunks.delete(k)}}}
updateChunks();
// Individual square leaves drift past the viewer.
const leafGeo=new THREE.BoxGeometry(.16,.035,.12);const leafMaterials=colors.leaf.map(c=>mat(c));const falling=[];for(let i=0;i<110;i++){let leaf=new THREE.Mesh(leafGeo,leafMaterials[i%leafMaterials.length]);leaf.position.set(camera.position.x+(Math.random()-.5)*35,Math.random()*15,camera.position.z+(Math.random()-.5)*35);leaf.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);leaf.userData={speed:.35+Math.random()*.65,phase:Math.random()*7,drift:.3+Math.random()*.6};scene.add(leaf);falling.push(leaf)}
let keys={},yaw=0,pitch=-.04,drag=false,lastX=0,lastY=0,walking=true,elapsed=0;const pause=document.querySelector('#pause');pause.addEventListener('click',()=>{walking=!walking;pause.textContent=walking?'Ⅱ':'▶';pause.title=walking?'Pause walking':'Resume walking';pause.setAttribute('aria-label',pause.title);document.querySelector('#walk-label').textContent=walking?'Walking slowly':'Taking a pause'});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{keys={};drag=false});renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.003;pitch=Math.max(-.6,Math.min(.5,pitch));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[b.dataset.key]=false);b.addEventListener('pointercancel',()=>keys[b.dataset.key]=false)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);elapsed+=dt;let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(!forward&&!side&&walking)forward=.42;let speed=3.5*dt;camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;camera.position.y=2.5+(forward||side?Math.sin(elapsed*5)*.025:0);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;sun.position.set(camera.position.x-18,32,camera.position.z+12);sun.target.position.set(camera.position.x,0,camera.position.z-8);sun.target.updateMatrixWorld();updateChunks();for(const l of falling){l.position.y-=l.userData.speed*dt;l.position.x+=Math.sin(elapsed+l.userData.phase)*dt*l.userData.drift;l.position.z+=Math.cos(elapsed*.7+l.userData.phase)*dt*.3;l.rotation.x+=dt;l.rotation.z+=dt*.7;if(l.position.y<.1||Math.abs(l.position.x-camera.position.x)>20||Math.abs(l.position.z-camera.position.z)>20){l.position.set(camera.position.x+(Math.random()-.5)*34,10+Math.random()*7,camera.position.z+(Math.random()-.5)*34)}}renderer.render(scene,camera)}animate();document.querySelector('#loading').classList.add('hidden');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
