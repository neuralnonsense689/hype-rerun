<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomhaven — a little world above the clouds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eee8da;color:#49483e;font-family:'DM Sans',sans-serif}canvas{display:block;width:100%;height:100%}.scene{position:fixed;inset:0}.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(249,246,236,.7),transparent 28%,transparent 75%,rgba(249,246,236,.22)),linear-gradient(0deg,rgba(236,229,214,.22),transparent 24%)}header{position:fixed;top:38px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:11px;font-size:11px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}.brand-icon{width:30px;height:30px;border:1px solid #928e7c;transform:rotate(45deg);display:grid;place-items:center}.brand-icon:after{content:'✿';font-size:16px;transform:rotate(-45deg);color:#b58b89}.top-right{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#888477}.top-right span{color:#bc9b91;margin:0 9px}.intro{position:fixed;left:7.2%;top:36%;pointer-events:none}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#a78d7c;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:24px;height:1px;background:#bca495}.intro h1{font-family:'Playfair Display',serif;font-size:clamp(42px,5.5vw,78px);line-height:1.02;font-weight:500;letter-spacing:-.045em;margin:19px 0 16px}.intro h1 em{font-weight:500;color:#b98586}.intro p{font-size:13px;line-height:1.8;color:#8a887b;max-width:220px}.side-note{position:fixed;right:48px;top:48%;writing-mode:vertical-rl;text-transform:uppercase;letter-spacing:.22em;font-size:9px;color:#9d9a8d}.bottom{position:fixed;left:48px;right:48px;bottom:35px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.caption{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#aaa396}.caption strong{display:block;color:#716f63;font-weight:600;margin-bottom:8px}.hint{display:flex;align-items:center;gap:11px;color:#8d8b7e;font-size:10px;letter-spacing:.08em}.mouse{width:19px;height:27px;border:1px solid #a7a394;border-radius:12px;position:relative}.mouse:before{content:'';position:absolute;width:2px;height:5px;left:8px;top:5px;background:#a7a394;border-radius:2px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#eee9dd;z-index:5;color:#9a8e7e;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:opacity .8s}.loading.hide{opacity:0;pointer-events:none}@media(max-width:700px){header{top:24px;left:24px;right:24px}.top-right{display:none}.intro{left:25px;top:22%}.intro h1{font-size:45px}.intro p{font-size:12px;max-width:175px}.side-note{right:22px}.bottom{left:24px;right:24px;bottom:24px}.caption{font-size:9px}.hint{font-size:9px}}
</style>
</head>
<body>
<div class="loading" id="loading">Growing a little world ...</div><div class="scene" id="scene"></div><div class="veil"></div>
<header><div class="brand"><div class="brand-icon"></div> Bloomhaven</div><div class="top-right">A quiet place <span>✦</span> No. 01</div></header>
<div class="intro"><div class="eyebrow">Somewhere above the clouds</div><h1>A world<br>in <em>bloom.</em></h1><p>A little escape, suspended in the sky. Stay awhile and watch the petals fall.</p></div>
<div class="side-note">An ode to slow moments &nbsp; ✦ &nbsp; 2025</div>
<div class="bottom"><div class="caption"><strong>The floating garden</strong>A tiny world, made of wonder</div><div class="hint"><div class="mouse"></div> Drag to explore</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeee9dc); scene.fog=new THREE.Fog(0xeee9dc,24,52);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100); camera.position.set(13,10,19);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; document.querySelector('#scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.enablePan=false; controls.minDistance=13; controls.maxDistance=30; controls.minPolarAngle=.7; controls.maxPolarAngle=1.6; controls.target.set(0,2.3,0); controls.autoRotate=true; controls.autoRotateSpeed=.28;
scene.add(new THREE.HemisphereLight(0xfff8e8,0xaaa18b,2.25)); const sun=new THREE.DirectionalLight(0xffedcf,2.5); sun.position.set(-8,14,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-12,right:12,top:14,bottom:-12,near:.5,far:40}); sun.shadow.bias=-.0004; scene.add(sun);
let seed=27; function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296} function pick(a){return a[Math.floor(rand()*a.length)]}
const world=new THREE.Group(); scene.add(world); const box=new THREE.BoxGeometry(1,1,1); const mats={}; function mat(c){return mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:1}));}
const batches={}; function voxel(x,y,z,sx,sy,sz,color){let k=color; (batches[k]||(batches[k]=[])).push([x,y,z,sx,sy,sz]);}
const rock=['#77796a','#858575','#696e62','#92907c','#a09b86','#777b6d']; const grass=['#8b9a56','#9aa760','#a9b46e','#798c4e','#b5ba78','#8d9e5b']; const dirt=['#696d57','#777a5b','#85845f'];
// A layered, irregular island: a grassy rim over a tapering rocky underside.
const step=.42; for(let y=-5;y<=1;y++){let radius=[1.0,1.65,2.25,2.85,3.45,3.95,4.25][y+5]; for(let x=-11;x<=11;x++)for(let z=-10;z<=10;z++){let xx=x*step,zz=z*step; let d=Math.sqrt(xx*xx+zz*zz*1.12); let edge=radius+(rand()-.5)*.42; if(d<edge){let col=y===1?pick(grass):y===0?pick(dirt):pick(rock); voxel(xx,y*step,zz,step+.018,step+.018,step+.018,col); if(y===1&&rand()<.09) voxel(xx, .68,zz,.2,.12,.2,pick(grass));}}}
// Little rocky fragments below the island.
for(let i=0;i<17;i++){let a=rand()*Math.PI*2,r=2.2+rand()*2.2,y=-2.5-rand()*1.8; let s=.14+rand()*.28;voxel(Math.cos(a)*r,y,Math.sin(a)*r,s,s*(.8+rand()),s,pick(rock));}
// Trailing vines on the island rim.
for(let i=0;i<48;i++){let a=rand()*Math.PI*2,r=3.45+rand()*.55,x=Math.cos(a)*r,z=Math.sin(a)*r; let len=2+Math.floor(rand()*8); for(let j=0;j<len;j++){voxel(x+Math.sin(j*.8+i)*.055,.1-j*.24,z,.075,.25,.075,pick(['#6f8350','#829754','#99a66c']));if(rand()<.3)voxel(x+.11,.05-j*.24,z,.17,.09,.13,'#879c5b');}}
// Trunk and branches are built as stepped square timbers.
const bark=['#5d5044','#6d5a4a','#796552','#554b40']; function limb(a,b,r1,r2){let d=new THREE.Vector3(...b).sub(new THREE.Vector3(...a));let n=Math.ceil(d.length()/.18);for(let i=0;i<=n;i++){let t=i/n;let p=new THREE.Vector3(...a).lerp(new THREE.Vector3(...b),t);let r=r1*(1-t)+r2*t; voxel(p.x,p.y,p.z,r,r,r,pick(bark));}}
limb([0,.5,0],[.1,1.8,0],.85,.65);limb([.1,1.7,0],[-.2,2.9,.05],.65,.48);limb([-.2,2.8,.05],[.15,4,.05],.48,.3);limb([.15,3.8,.05],[.1,5.1,.1],.3,.14);
const branches=[[[0,2.3,0],[-1.3,3.5,.2],[-2.6,4.3,.3]],[[0,2.7,0],[1.3,3.5,.1],[2.8,4.2,.1]],[[0,3.2,0],[-.8,4.2,-.5],[-1.8,5,-1]],[[0,3.4,0],[.9,4.4,-.4],[1.8,5.2,-.9]],[[0,3,0],[.5,3.9,1],[1.5,4.6,1.7]],[[0,3.1,0],[-.7,3.9,1],[-1.8,4.5,1.6]],[[0,4,0],[-.3,5,-.1],[-.8,5.8,0]]]; for(const [a,b,c] of branches){limb(a,b,.32,.18);limb(b,c,.18,.08);}
// Exposed roots.
for(let i=0;i<8;i++){let a=i*Math.PI/4;limb([0,.65,0],[Math.cos(a)*1.35,.48,Math.sin(a)*1.35],.34,.13)}
const blossoms=['#e8b7b6','#eec4c1','#f1ceca','#dca7a8','#e8b3b5','#f5d7d1','#d99fa3'];
const crowns=[[-2.35,4.45,.15,1.25],[-1.65,5.25,-.6,1.2],[-.65,5.7,0,1.35],[.55,5.55,-.35,1.4],[1.65,5.05,-.55,1.25],[2.5,4.45,.1,1.15],[1.3,4.65,1.25,1.2],[-1.25,4.65,1.2,1.2],[0,5.1,1,1.2]];
for(const [cx,cy,cz,r] of crowns){for(let i=0;i<115;i++){let x=(rand()*2-1)*r,y=(rand()*2-1)*r*.63,z=(rand()*2-1)*r*.8;if(x*x/(r*r)+y*y/(r*r*.4)+z*z/(r*r*.64)>1)continue;let s=.18+rand()*.25;voxel(cx+x,cy+y,cz+z,s,s*.8,s,pick(blossoms));}}
// Mossy stones and tiny flowers across the garden.
for(let i=0;i<42;i++){let a=rand()*6.28,r=1.4+rand()*2.4,x=Math.cos(a)*r,z=Math.sin(a)*r;if(z>2.4&&Math.abs(x)<.8)continue;let s=.13+rand()*.25;voxel(x,.57,z,s,s*.6,s,pick(['#a6a38b','#777d68','#b3ad91','#c7c0a1']));}
for(let i=0;i<65;i++){let a=rand()*6.28,r=1.2+rand()*2.6;let x=Math.cos(a)*r,z=Math.sin(a)*r;voxel(x,.6,z,.06,.22,.06,'#718b55');voxel(x,.73,z,.13,.1,.13,pick(['#f3d3c9','#fff0d9','#dfb6b4']));}
// Small weathered stone markers.
for(const [x,z,h] of [[-2.5,-.3,1.1],[2.45,-.5,.8],[-1.9,-1.9,.5]]){voxel(x,.45+h/2,z,.34,h,.34,'#969782');voxel(x,.45+h,z,.22,.15,.22,'#b3b09a');voxel(x+.04,.6,z+.18,.1,.2,.05,'#83905e')}
for(const [color,items] of Object.entries(batches)){const mesh=new THREE.InstancedMesh(box,mat(color),items.length);const dummy=new THREE.Object3D();items.forEach((v,i)=>{dummy.position.set(v[0],v[1],v[2]);dummy.scale.set(v[3],v[4],v[5]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)});mesh.castShadow=true;mesh.receiveShadow=true;world.add(mesh)}
// Water spills over the front edge in translucent, vertical voxel ribbons.
const water=new THREE.Group(); world.add(water);const waterMats=[new THREE.MeshStandardMaterial({color:0xd8f0e9,transparent:true,opacity:.8,roughness:.28}),new THREE.MeshStandardMaterial({color:0xaacfc9,transparent:true,opacity:.7,roughness:.3}),new THREE.MeshStandardMaterial({color:0xf1faf1,transparent:true,opacity:.72,roughness:.3})]; for(let i=0;i<22;i++){let x=(i-10.5)*.085;let h=4.4+rand()*.8;let mesh=new THREE.Mesh(box,pick(waterMats));mesh.position.set(x,.36-h/2,3.78+(rand()-.5)*.16);mesh.scale.set(.075,h,.1);water.add(mesh)}
for(let i=0;i<20;i++){let m=new THREE.Mesh(box,pick(waterMats));m.position.set((rand()-.5)*1.7,.5,3.2+rand()*.6);m.scale.set(.12,.06,.18);world.add(m)}
// Airborne petals.
const petalGeo=new THREE.BoxGeometry(.1,.035,.1);const petals=[];for(let i=0;i<95;i++){let p=new THREE.Mesh(petalGeo,mat(pick(blossoms)));p.position.set((rand()-.5)*10,rand()*8-1,(rand()-.5)*7);p.userData={speed:.15+rand()*.25,phase:rand()*6.28};scene.add(p);petals.push(p)}
// A few soft, blocky clouds far behind the island.
const cloudMat=new THREE.MeshBasicMaterial({color:0xf8f5eb,transparent:true,opacity:.38});for(let i=0;i<14;i++){let group=new THREE.Group();for(let j=0;j<5;j++){let c=new THREE.Mesh(box,cloudMat);c.position.set(j*.7,rand()*.25,rand()*.3);c.scale.set(1.1,.3+rand()*.35,.6);group.add(c)}group.position.set((rand()-.5)*24,-2+rand()*7,-8-rand()*8);scene.add(group)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight); if(innerWidth<700){controls.target.set(0,2.2,0);camera.position.set(16,11,24)} }window.addEventListener('resize',resize);resize();let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;petals.forEach(p=>{p.position.y-=p.userData.speed*dt;p.position.x+=Math.sin(now*.001+p.userData.phase)*dt*.12;p.rotation.y+=dt*.5;if(p.position.y< -3)p.position.y=6});controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);document.querySelector('#loading').classList.add('hide');
</script></body></html>
