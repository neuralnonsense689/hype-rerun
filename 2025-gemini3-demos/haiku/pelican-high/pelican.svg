<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican in breeding plumage pedaling a bicycle</title>
  <defs>
    <!-- Primary flight feather, drawn pointing down before rotation -->
    <path id="primary" d="M-7 0 C-9 25 -6 50 -2 66 Q0 72 2 66 C6 50 9 25 7 0 Z"/>
    <clipPath id="bodyClip">
      <ellipse cx="352" cy="228" rx="88" ry="44" transform="rotate(-18 352 228)"/>
    </clipPath>
  </defs>

  <!-- Sky, ground, shadow -->
  <rect width="800" height="600" fill="#e6f3fb"/>
  <rect y="525" width="800" height="75" fill="#d9c9a0"/>
  <ellipse cx="400" cy="530" rx="280" ry="9" fill="#000" opacity="0.15"/>

  <!-- Rear wheel -->
  <g transform="translate(240 440)">
    <circle r="85" fill="none" stroke="#1f1f1f" stroke-width="9"/>
    <circle r="79" fill="none" stroke="#8a8a8a" stroke-width="3"/>
    <g stroke="#a5a5a5" stroke-width="1.2" fill="none">
      <path d="M0-79V79"/>
      <path d="M0-79V79" transform="rotate(22.5)"/>
      <path d="M0-79V79" transform="rotate(45)"/>
      <path d="M0-79V79" transform="rotate(67.5)"/>
      <path d="M0-79V79" transform="rotate(90)"/>
      <path d="M0-79V79" transform="rotate(112.5)"/>
      <path d="M0-79V79" transform="rotate(135)"/>
      <path d="M0-79V79" transform="rotate(157.5)"/>
    </g>
    <circle r="7" fill="#444"/>
    <circle r="2.5" fill="#ddd"/>
  </g>

  <!-- Front wheel -->
  <g transform="translate(560 440)">
    <circle r="85" fill="none" stroke="#1f1f1f" stroke-width="9"/>
    <circle r="79" fill="none" stroke="#8a8a8a" stroke-width="3"/>
    <g stroke="#a5a5a5" stroke-width="1.2" fill="none">
      <path d="M0-79V79"/>
      <path d="M0-79V79" transform="rotate(22.5)"/>
      <path d="M0-79V79" transform="rotate(45)"/>
      <path d="M0-79V79" transform="rotate(67.5)"/>
      <path d="M0-79V79" transform="rotate(90)"/>
      <path d="M0-79V79" transform="rotate(112.5)"/>
      <path d="M0-79V79" transform="rotate(135)"/>
      <path d="M0-79V79" transform="rotate(157.5)"/>
    </g>
    <circle r="7" fill="#444"/>
    <circle r="2.5" fill="#ddd"/>
  </g>

  <!-- Far leg, crank and pedal (behind the frame) -->
  <path d="M330 435 L305 384" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <path d="M330 262 Q306 300 304 340 L302 374" stroke="#1d1d1d" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M296 376 L314 372 Q322 380 316 384 L300 388 Q292 384 296 376 Z" fill="#2b2b2b"/>
  <rect x="296" y="381" width="18" height="5" rx="2" fill="#333"/>

  <!-- Frame -->
  <g fill="none" stroke="#b8322a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 435 L240 440"/>             <!-- chain stays -->
    <path d="M319 355 L240 440"/>             <!-- seat stays -->
    <path d="M330 435 L308 280"/>             <!-- seat tube -->
    <path d="M308 292 L530 292"/>             <!-- top tube -->
    <path d="M330 435 L534 334"/>             <!-- down tube -->
    <path d="M526 290 L538 336" stroke-width="12"/>  <!-- head tube -->
    <path d="M538 336 L560 440" stroke-width="7"/>   <!-- fork -->
  </g>

  <!-- Drivetrain -->
  <g fill="none" stroke="#666" stroke-width="3">
    <circle cx="330" cy="435" r="24"/>
    <circle cx="240" cy="440" r="12"/>
  </g>
  <path d="M330 411 L240 428 M330 459 L240 452" stroke="#333" stroke-width="2.5"/>

  <!-- Saddle and handlebars -->
  <path d="M266 282 Q300 270 334 276 Q337 286 328 290 Q298 294 268 290 Z" fill="#1e1e1e"/>
  <path d="M528 290 L536 252 L572 246 Q590 245 586 264" fill="none" stroke="#2d2d2d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Near crank, pedal, leg and webbed foot -->
  <path d="M330 435 L355 486" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="338" y="484" width="34" height="6" rx="2" fill="#333"/>
  <path d="M345 262 Q388 300 378 336 Q370 400 368 476" stroke="#2b2b2b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M346 476 L376 472 Q388 478 386 486 Q378 490 368 486 Q360 494 346 490 Q338 486 346 476 Z" fill="#2b2b2b"/>

  <!-- Body: breeding adult, brown body with dark chocolate breast -->
  <ellipse cx="352" cy="228" rx="88" ry="44" transform="rotate(-18 352 228)" fill="#6b5d52"/>
  <ellipse cx="412" cy="240" rx="42" ry="30" transform="rotate(-18 412 240)" fill="#4b2e1e" clip-path="url(#bodyClip)"/>

  <!-- Wing folded over the back, with separate primary feathers -->
  <path d="M398 206 C360 176 306 190 262 244 C296 238 336 244 370 232 C388 226 398 218 398 206 Z" fill="#5a4c42" stroke="#2e2620" stroke-width="1.2"/>
  <path d="M300 236 Q340 214 390 210" fill="none" stroke="#2e2620" stroke-width="1.5"/>
  <g fill="#3b322b" stroke="#1e1712" stroke-width="1.2">
    <use xlink:href="#primary" transform="translate(330 238) rotate(92)"/>
    <use xlink:href="#primary" transform="translate(316 241) rotate(86)"/>
    <use xlink:href="#primary" transform="translate(302 244) rotate(80)"/>
    <use xlink:href="#primary" transform="translate(288 247) rotate(74)"/>
    <use xlink:href="#primary" transform="translate(276 250) rotate(68)"/>
  </g>

  <!-- Feather scallops on body and wing -->
  <g fill="none" stroke="#2e2620" stroke-width="1.3">
    <path d="M300 240 q6 6 12 0"/>
    <path d="M318 232 q6 6 12 0"/>
    <path d="M336 226 q6 6 12 0"/>
    <path d="M354 222 q6 6 12 0"/>
    <path d="M372 218 q6 6 12 0"/>
    <path d="M390 218 q6 6 12 0"/>
    <path d="M350 250 q6 6 12 0"/>
    <path d="M368 248 q6 6 12 0"/>
    <path d="M386 242 q6 6 12 0"/>
    <path d="M404 236 q6 6 12 0"/>
  </g>

  <!-- Neck: dark lower neck, white upper neck, chestnut hindneck patch -->
  <path d="M418 226 C440 200 450 178 478 150" fill="none" stroke="#4b2e1e" stroke-width="30" stroke-linecap="round"/>
  <path d="M440 200 C452 182 462 168 480 150" fill="none" stroke="#f7f5ee" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="446" cy="190" rx="6" ry="13" transform="rotate(30 446 190)" fill="#8a4b2a"/>

  <!-- Head: white with buff-yellow crown -->
  <ellipse cx="490" cy="140" rx="23" ry="19" fill="#f7f5ee"/>
  <ellipse cx="488" cy="126" rx="15" ry="7" transform="rotate(-20 488 126)" fill="#ecd98a"/>
  <circle cx="496" cy="136" r="5" fill="#e9d86a"/>
  <circle cx="496" cy="136" r="2.5" fill="#111"/>

  <!-- Bill and gular pouch -->
  <path d="M502 128 Q556 132 608 176 Q562 158 504 150 Z" fill="#8c8270" stroke="#4a4438" stroke-width="1"/>
  <path d="M500 150 L586 182 L584 188 L500 158 Z" fill="#7d735f"/>
  <path d="M504 152 L580 182 Q590 192 580 204 Q560 220 532 214 Q512 208 504 178 Z" fill="#a8374f" stroke="#6b2131" stroke-width="1.5"/>
</svg>
