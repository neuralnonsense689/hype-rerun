<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican in breeding plumage pedaling a bicycle</title>
  <defs>
    <!-- 16 spokes per wheel, laced tangentially from a small hub offset to the rim -->
    <g id="spokes" stroke="#8a9199" stroke-width="1.3" fill="none">
      <path d="M0 12L90 0M-4.59 11.09L83.15 34.44M-8.49 8.49L63.64 63.64M-11.09 4.59L34.44 83.15M-12 0L0 90M-11.09 -4.59L-34.44 83.15M-8.49 -8.49L-63.64 63.64M-4.59 -11.09L-83.15 34.44M0 -12L-90 0M4.59 -11.09L-83.15 -34.44M8.49 -8.49L-63.64 -63.64M11.09 -4.59L-34.44 -83.15M12 0L0 -90M11.09 4.59L34.44 -83.15M8.49 8.49L63.64 -63.64M4.59 11.09L83.15 -34.44"/>
    </g>
  </defs>

  <!-- Background: sky, sea, beach -->
  <rect width="800" height="400" fill="#cfeaf5"/>
  <circle cx="690" cy="90" r="46" fill="#ffd66b" opacity="0.9"/>
  <rect y="400" width="800" height="100" fill="#6fb8d9"/>
  <rect y="500" width="800" height="100" fill="#e6d29a"/>
  <ellipse cx="400" cy="522" rx="230" ry="7" fill="#5b4a2a" opacity="0.25"/>

  <!-- Motion lines -->
  <path d="M90 380H130M110 404H146M96 428H128" stroke="#5a6a78" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Wheels -->
  <g>
    <circle cx="240" cy="430" r="90" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="240" cy="430" r="84" fill="none" stroke="#b8bec4" stroke-width="2.5"/>
    <use xlink:href="#spokes" x="240" y="430"/>
    <circle cx="240" cy="430" r="12" fill="none" stroke="#444" stroke-width="3"/>
    <circle cx="240" cy="430" r="8" fill="#555"/>
  </g>
  <g>
    <circle cx="560" cy="430" r="90" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="560" cy="430" r="84" fill="none" stroke="#b8bec4" stroke-width="2.5"/>
    <use xlink:href="#spokes" x="560" y="430"/>
    <circle cx="560" cy="430" r="8" fill="#555"/>
  </g>

  <!-- Drivetrain: chainring, chain, crank arms, pedals -->
  <circle cx="330" cy="430" r="26" fill="none" stroke="#4a4a4a" stroke-width="3"/>
  <path d="M330 456L240 442M330 404L240 418" stroke="#1d1d1d" stroke-width="2.5" fill="none"/>
  <path d="M330 430L368 412M330 430L292 448" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="283" y="445" width="18" height="7" rx="2" fill="#222"/>
  <rect x="359" y="408" width="18" height="7" rx="2" fill="#222"/>
  <circle cx="330" cy="430" r="6" fill="#444"/>

  <!-- Far leg (behind the frame) -->
  <path d="M300 300L286 350L292 402" stroke="#2e2e2e" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 400L298 438L290 448L276 442Z" fill="#2e2e2e"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M318 306L530 322"/>
    <path d="M330 430L522 360"/>
    <path d="M330 430L318 306"/>
    <path d="M330 430L240 430"/>
    <path d="M522 360L560 430" stroke-width="7"/>
  </g>
  <path d="M321 335L240 430" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <path d="M535 320L522 360" stroke="#a93226" stroke-width="12" stroke-linecap="round"/>
  <path d="M318 306L314 288" stroke="#c9ced3" stroke-width="5" stroke-linecap="round"/>
  <rect x="290" y="280" width="52" height="10" rx="5" fill="#1e1e1e"/>
  <path d="M535 320L541 296" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M541 296Q556 282 578 292" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Tail -->
  <path d="M270 300L232 322L242 330L262 318L268 332L282 312Z" fill="#3a2d22"/>

  <!-- Body -->
  <path d="M262 292C270 258 320 232 375 222C395 218 412 222 420 232C432 248 430 270 418 282C400 300 365 312 330 314C300 316 275 312 262 292Z" fill="#4a3b2e"/>
  <ellipse cx="410" cy="262" rx="14" ry="20" fill="#6e3420" transform="rotate(20 410 262)"/>
  <path d="M290 262q6 6 12 0M306 276q6 6 12 0M322 258q6 6 12 0M340 272q6 6 12 0M356 252q6 6 12 0" stroke="#2a2018" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Wing: silver-gray coverts along the top, brown flight feathers below -->
  <path d="M372 228C340 214 290 240 252 276C240 287 228 296 220 302C232 300 250 298 262 300C268 306 272 310 276 318C290 310 300 308 310 312C320 306 332 300 340 300C352 292 362 280 380 262Z" fill="#65533f"/>
  <path d="M372 228C340 214 290 240 252 276L262 284C296 252 330 240 366 240Z" fill="#9c9a8f"/>
  <path d="M236 292Q246 300 258 300M250 296Q262 306 274 314M280 300Q290 310 300 314M318 296Q326 304 336 306M300 268Q308 276 316 274M330 262Q338 270 346 268" stroke="#2a2016" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Neck: white, chestnut at the base and on the hindneck -->
  <path d="M414 252C432 226 446 222 470 218L490 216" stroke="#f5f2e6" stroke-width="24" fill="none" stroke-linecap="round"/>
  <ellipse cx="416" cy="246" rx="11" ry="12" fill="#6e3420"/>
  <ellipse cx="462" cy="210" rx="16" ry="6" fill="#7a3b25" transform="rotate(-10 462 210)"/>

  <!-- Head: white with a yellow-buff crown -->
  <ellipse cx="494" cy="216" rx="20" ry="17" fill="#f5f2e6"/>
  <ellipse cx="490" cy="204" rx="14" ry="6" fill="#e6cf7e"/>
  <circle cx="502" cy="212" r="3.5" fill="#e9c94a"/>
  <circle cx="502" cy="212" r="1.6" fill="#111"/>

  <!-- Bill and pouch -->
  <path d="M506 208L600 254L598 262L508 228Z" fill="#c4b57a" stroke="#7d7150" stroke-width="1"/>
  <path d="M508 228L598 262C590 280 570 296 548 292C530 289 518 262 508 228Z" fill="#8c5566" stroke="#5a3040" stroke-width="1.5"/>
  <path d="M524 262Q542 274 568 276M536 250Q554 262 582 264" stroke="#5a3040" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Near leg (pedaling forward) and webbed foot on the pedal -->
  <path d="M305 298L352 340L362 395" stroke="#3b3b3b" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M358 390L384 404Q390 412 380 415L360 412Z" fill="#3b3b3b"/>
  <path d="M366 400L386 410" stroke="#2a2a2a" stroke-width="1.2" fill="none"/>
</svg>
