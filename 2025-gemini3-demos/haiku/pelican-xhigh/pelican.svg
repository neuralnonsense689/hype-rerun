<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican in breeding plumage riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fcbef"/>
      <stop offset="1" stop-color="#e3f6fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fa8"/>
      <stop offset="1" stop-color="#8fd0e6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5038"/>
      <stop offset="1" stop-color="#2e2218"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3026"/>
      <stop offset="1" stop-color="#7a6650"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8402f"/>
      <stop offset="0.6" stop-color="#e07040"/>
      <stop offset="1" stop-color="#efc57e"/>
    </linearGradient>
  </defs>

  <!-- Background: sky, sun, clouds, sea, beach, road -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="720" cy="90" r="40" fill="#ffe08a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="96" rx="58" ry="16"/>
    <ellipse cx="180" cy="84" rx="36" ry="18"/>
    <ellipse cx="430" cy="62" rx="50" ry="14"/>
    <ellipse cx="462" cy="52" rx="30" ry="15"/>
  </g>
  <rect y="380" width="800" height="90" fill="url(#sea)"/>
  <path d="M60 430q12-8 24 0t24 0M300 412q12-8 24 0t24 0M600 420q12-8 24 0t24 0" fill="none" stroke="#e8f8fd" stroke-width="2" opacity="0.7"/>
  <rect y="470" width="800" height="60" fill="#e9d7a0"/>
  <rect y="530" width="800" height="70" fill="#4a4d52"/>
  <line x1="0" y1="568" x2="800" y2="568" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="30 22"/>
  <ellipse cx="400" cy="532" rx="260" ry="6" fill="#000" opacity="0.2"/>

  <!-- Rear wheel: rim, 16 spokes, tire, hub -->
  <g id="rear-wheel">
    <circle cx="230" cy="430" r="88" fill="none" stroke="#c9d2d8" stroke-width="3"/>
    <path d="M230 430L318 430M230 430L311 464M230 430L292 492M230 430L264 511M230 430L230 518M230 430L196 511M230 430L168 492M230 430L149 464M230 430L142 430M230 430L149 396M230 430L168 368M230 430L196 349M230 430L230 342M230 430L264 349M230 430L292 368M230 430L311 396" stroke="#9aa6ae" stroke-width="1.2"/>
    <circle cx="230" cy="430" r="94" fill="none" stroke="#1c1c1c" stroke-width="12"/>
    <circle cx="230" cy="430" r="7" fill="#444"/>
  </g>

  <!-- Front wheel: rim, 16 spokes, tire, hub -->
  <g id="front-wheel">
    <circle cx="570" cy="430" r="88" fill="none" stroke="#c9d2d8" stroke-width="3"/>
    <path d="M570 430L658 430M570 430L651 464M570 430L632 492M570 430L604 511M570 430L570 518M570 430L536 511M570 430L508 492M570 430L489 464M570 430L482 430M570 430L489 396M570 430L508 368M570 430L536 349M570 430L570 342M570 430L604 349M570 430L632 368M570 430L651 396" stroke="#9aa6ae" stroke-width="1.2"/>
    <circle cx="570" cy="430" r="94" fill="none" stroke="#1c1c1c" stroke-width="12"/>
    <circle cx="570" cy="430" r="7" fill="#444"/>
  </g>

  <!-- Chainring, rear cog, chain -->
  <circle cx="360" cy="438" r="20" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <circle cx="230" cy="430" r="10" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M360 418L240 420M360 458L240 440" stroke="#2b2b2b" stroke-width="2.5"/>

  <!-- Bicycle frame (teal) -->
  <g fill="none" stroke="#1f6f7a" stroke-linecap="round">
    <path d="M305 270L230 430" stroke-width="6"/>   <!-- seat stays -->
    <path d="M360 438L230 430" stroke-width="7"/>   <!-- chain stays -->
    <path d="M360 438L302 262" stroke-width="10"/> <!-- seat tube -->
    <path d="M305 270L512 262" stroke-width="9"/>  <!-- top tube -->
    <path d="M360 438L516 300" stroke-width="11"/> <!-- down tube -->
    <path d="M512 262L520 302" stroke-width="13"/> <!-- head tube -->
    <path d="M520 302L570 430" stroke-width="8"/>  <!-- fork -->
  </g>
  <path d="M512 262L524 226" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <path d="M524 226L566 218Q592 216 588 244Q585 258 568 252" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Seat post and saddle -->
  <path d="M302 262L306 248" stroke="#8c9399" stroke-width="5" stroke-linecap="round"/>
  <path d="M282 250Q298 240 340 244Q356 248 344 256Q320 262 290 262Q278 258 282 250Z" fill="#1a1a1a"/>

  <!-- Far crank, pedal, and leg (behind the body) -->
  <line x1="360" y1="438" x2="308" y2="418" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round"/>
  <rect x="294" y="415" width="28" height="6" rx="2" fill="#151515"/>
  <path d="M345 250L376 340" stroke="#2a1f16" stroke-width="24" stroke-linecap="round"/>
  <path d="M376 340L308 412" stroke="#3d3d3d" stroke-width="8" stroke-linecap="round"/>
  <path d="M296 404Q310 398 324 404Q326 412 316 414L296 414Z" fill="#4a4a50"/>

  <!-- Tail -->
  <path d="M238 226L178 234L188 244L176 252L240 248Z" fill="#2c2119"/>

  <!-- Neck: white foreneck with chestnut hindneck -->
  <path d="M448 214C470 188 466 162 492 138" fill="none" stroke="#f3f0e6" stroke-width="30" stroke-linecap="round"/>
  <path d="M436 210C458 186 454 158 484 132" fill="none" stroke="#7a2e1c" stroke-width="10" stroke-linecap="round"/>
  <path d="M470 190q6 6 0 12M478 168q6 6 0 12" fill="none" stroke="#b8b09a" stroke-width="1.2"/>

  <!-- Body: dark brown breeding body -->
  <path d="M232 214C258 186 312 170 372 166C410 164 440 180 452 208C460 228 444 254 404 258C360 262 300 260 262 258C238 256 224 240 232 214Z" fill="url(#body)"/>
  <g fill="none" stroke="#1d150e" stroke-width="1.4" opacity="0.6">
    <path d="M404 196q8 8 0 16M420 204q8 8 0 16M410 222q8 8 0 16M424 230q8 8 0 16M392 236q8 8 0 14"/>
  </g>

  <!-- Folded wing: scalloped primaries, feather separations, silver coverts -->
  <path d="M388 178C340 166 282 178 236 202C222 210 210 216 198 224Q214 230 236 232Q248 250 262 238Q276 254 292 242Q306 258 322 246Q336 256 352 244C378 236 396 214 388 178Z" fill="url(#wing)" stroke="#2a2118" stroke-width="1.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#2a2118" stroke-width="1.4">
    <path d="M236 232Q238 218 244 208"/>
    <path d="M262 238Q266 220 272 206"/>
    <path d="M292 242Q296 222 302 210"/>
    <path d="M322 246Q326 228 332 214"/>
    <path d="M352 244Q356 228 362 218"/>
  </g>
  <path d="M376 196C330 190 280 200 240 216" fill="none" stroke="#c4ccd1" stroke-width="1.6" opacity="0.8"/>
  <path d="M370 210C332 206 290 214 252 226" fill="none" stroke="#c4ccd1" stroke-width="1.2" opacity="0.6"/>

  <!-- Near crank and pedal -->
  <line x1="360" y1="438" x2="412" y2="458" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="398" y="455" width="28" height="6" rx="2" fill="#151515"/>

  <!-- Near leg pushing the pedal, with webbed foot -->
  <path d="M345 250L384 342" stroke="#3a2a1d" stroke-width="26" stroke-linecap="round"/>
  <path d="M384 342L406 440" stroke="#444" stroke-width="9" stroke-linecap="round"/>
  <path d="M396 448Q414 442 436 450Q442 456 430 455L398 455Z" fill="#55555c" stroke="#2a2a2a" stroke-width="1"/>
  <path d="M414 452L428 444M420 455L436 448" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="360" cy="438" r="6" fill="#222"/>

  <!-- Head: white with pale yellow crown, dark eye -->
  <ellipse cx="522" cy="126" rx="26" ry="22" fill="#f7f4ea"/>
  <ellipse cx="518" cy="108" rx="18" ry="8" fill="#ece29c" opacity="0.85"/>
  <circle cx="530" cy="122" r="4.5" fill="#f1ebc4" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="531" cy="122" r="2" fill="#111"/>

  <!-- Bill and large gular pouch -->
  <path d="M536 114Q600 118 668 156Q672 162 664 161Q600 142 536 140Z" fill="#a79454" stroke="#4a4130" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M536 140Q600 142 662 160Q644 196 612 210Q584 216 568 192Q552 168 536 140Z" fill="url(#pouch)" stroke="#6b3a24" stroke-width="1.2"/>
  <path d="M566 176Q600 186 636 176M580 196Q606 200 626 188" fill="none" stroke="#7a3a22" stroke-width="1" opacity="0.6"/>
</svg>
