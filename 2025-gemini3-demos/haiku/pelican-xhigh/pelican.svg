<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>California brown pelican in breeding plumage pedaling a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbfee"/>
      <stop offset="1" stop-color="#d8f1fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fc4"/>
      <stop offset="1" stop-color="#1d6fa3"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b72"/>
      <stop offset="1" stop-color="#4a4e54"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4530"/>
      <stop offset="1" stop-color="#2e1b11"/>
    </linearGradient>
    <!-- One wheel drawn at the origin: tire, rim, 24 spokes, hub. Placed twice with <use> -->
    <g id="wheel" fill="none">
      <circle r="145" stroke="#1c1c1c" stroke-width="12"/>
      <circle r="133" stroke="#a7adb4" stroke-width="3"/>
      <path stroke="#dfe3e8" stroke-width="1.3" d="M0 -8L0 -133M2.07 -7.73L34.4 -128.5M4 -6.93L66.5 -115.2M5.66 -5.66L94 -94M6.93 -4L115.2 -66.5M7.73 -2.07L128.5 -34.4M8 0L133 0M7.73 2.07L128.5 34.4M6.93 4L115.2 66.5M5.66 5.66L94 94M4 6.93L66.5 115.2M2.07 7.73L34.4 128.5M0 8L0 133M-2.07 7.73L-34.4 128.5M-4 6.93L-66.5 115.2M-5.66 5.66L-94 94M-6.93 4L-115.2 66.5M-7.73 2.07L-128.5 34.4M-8 0L-133 0M-7.73 -2.07L-128.5 -34.4M-6.93 -4L-115.2 -66.5M-5.66 -5.66L-94 -94M-4 -6.93L-66.5 -115.2M-2.07 -7.73L-34.4 -128.5"/>
      <circle r="9" fill="#3a3a3a" stroke="none"/>
    </g>
  </defs>

  <!-- Sky, sun, clouds -->
  <rect width="1200" height="520" fill="url(#sky)"/>
  <circle cx="1040" cy="130" r="64" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="170" cy="150" rx="70" ry="22"/>
    <ellipse cx="212" cy="134" rx="46" ry="26"/>
    <ellipse cx="1090" cy="300" rx="60" ry="18"/>
    <ellipse cx="1122" cy="288" rx="38" ry="20"/>
  </g>

  <!-- Ocean, beach, road -->
  <rect y="520" width="1200" height="120" fill="url(#sea)"/>
  <path d="M0 556H1200M0 592H1200M0 624H1200" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="60 40"/>
  <rect y="640" width="1200" height="141" fill="#e9d7a4"/>
  <rect y="781" width="1200" height="119" fill="url(#road)"/>
  <rect y="781" width="1200" height="5" fill="#9aa0a7"/>
  <path d="M0 846H1200" stroke="#f2c94c" stroke-width="5" stroke-dasharray="40 30"/>
  <ellipse cx="585" cy="786" rx="380" ry="8" fill="#000000" opacity="0.2"/>

  <!-- Speed lines behind the bike -->
  <path d="M40 556H160M20 600H140M50 644H170" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Wheels: rear at (370, 630), front at (800, 630) -->
  <use href="#wheel" transform="translate(370 630)"/>
  <use href="#wheel" transform="translate(800 630)"/>

  <!-- Bicycle frame (diamond frame: chainstays, seatstays, seat tube, top tube, down tube, head tube, fork) -->
  <g fill="none" stroke="#3a3f47" stroke-linecap="round">
    <path d="M370 630L540 655" stroke-width="8"/>
    <path d="M370 630L487 476" stroke-width="7"/>
    <path d="M540 655L484 466" stroke-width="13"/>
    <path d="M484 472L744 452" stroke-width="11"/>
    <path d="M758 512L540 655" stroke-width="14"/>
    <path d="M744 448L760 514" stroke-width="15"/>
    <path d="M761 514L800 630" stroke-width="10"/>
  </g>

  <!-- Stem, drop handlebar, seat post, saddle -->
  <path d="M744 448L752 414" stroke="#222222" stroke-width="10" stroke-linecap="round"/>
  <path d="M752 414C780 404 808 396 818 414C828 430 822 452 800 460" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <path d="M484 470L482 440" stroke="#8a8f96" stroke-width="6" stroke-linecap="round"/>
  <path d="M430 452C432 440 470 436 520 438C532 440 534 456 522 460L442 462C432 462 428 458 430 452Z" fill="#1f1f1f"/>

  <!-- Drivetrain: chainring, rear cog, chain, crank arms, pedals -->
  <circle cx="540" cy="655" r="36" fill="none" stroke="#a5aab0" stroke-width="4"/>
  <circle cx="370" cy="630" r="18" fill="none" stroke="#a5aab0" stroke-width="4"/>
  <path d="M540 655L605 617M540 655L475 693" stroke="#4a4a4a" stroke-width="9" stroke-linecap="round"/>
  <rect x="457" y="689" width="36" height="8" rx="2" fill="#222222"/>
  <rect x="587" y="613" width="36" height="8" rx="2" fill="#222222"/>
  <path d="M540 619L370 612M540 691L370 648" stroke="#1f1f1f" stroke-width="3"/>
  <circle cx="540" cy="655" r="7" fill="#333333"/>

  <!-- Pelican: tail and flight feathers, drawn behind the body -->
  <g stroke="#170e08" stroke-width="1.5">
    <ellipse cx="362" cy="438" rx="38" ry="11" transform="rotate(158 362 438)" fill="#2c1b10"/>
    <ellipse cx="372" cy="428" rx="36" ry="10" transform="rotate(146 372 428)" fill="#2c1b10"/>
    <ellipse cx="374" cy="381" rx="126" ry="13" transform="rotate(176 374 381)" fill="#3e2a1c"/>
    <ellipse cx="370" cy="395" rx="120" ry="13" transform="rotate(175 370 395)" fill="#3e2a1c"/>
    <ellipse cx="372" cy="410" rx="111" ry="13" transform="rotate(173 372 410)" fill="#3e2a1c"/>
    <ellipse cx="378" cy="421" rx="97" ry="12" transform="rotate(171 378 421)" fill="#3e2a1c"/>
    <ellipse cx="387" cy="431" rx="82" ry="12" transform="rotate(170 387 431)" fill="#3e2a1c"/>
    <ellipse cx="399" cy="438" rx="64" ry="11" transform="rotate(168 399 438)" fill="#3e2a1c"/>
  </g>

  <!-- Body: dark brown breeding body -->
  <path d="M370 410C380 365 440 335 510 330C560 326 600 320 630 325C690 332 720 370 712 405C706 435 670 448 620 452C580 455 530 452 480 448C440 445 395 440 370 425Z" fill="url(#body)"/>
  <g fill="none" stroke="#24150c" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M548 424q12-8 24 0M582 428q12-8 24 0M616 426q12-8 24 0M650 416q12-8 24 0M676 402q10-7 20 0"/>
  </g>

  <!-- Wing coverts: silvery upper wing feathers laid over the body -->
  <g fill="#8a7866" stroke="#2a1c12" stroke-width="1.5">
    <ellipse cx="501" cy="359" rx="72" ry="15" transform="rotate(170 501 359)"/>
    <ellipse cx="497" cy="378" rx="71" ry="15" transform="rotate(167 497 378)"/>
    <ellipse cx="494" cy="395" rx="64" ry="14" transform="rotate(165 494 395)"/>
    <ellipse cx="496" cy="411" rx="53" ry="13" transform="rotate(161 496 411)"/>
  </g>

  <!-- Neck: chestnut brown, with feather marks -->
  <path d="M630 336C650 300 668 268 716 230L752 232C716 268 706 318 694 372Z" fill="#7a4126"/>
  <path d="M664 300q8-6 16 0M676 318q8-6 16 0M688 338q8-6 16 0" fill="none" stroke="#c07a4a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Head: white, with a golden patch on the back of the head -->
  <ellipse cx="748" cy="238" rx="28" ry="24" fill="#f8f6ee" stroke="#cfc8b5" stroke-width="1.2"/>
  <ellipse cx="724" cy="236" rx="11" ry="15" fill="#e8b93a"/>
  <circle cx="758" cy="232" r="4.5" fill="#1d1d1d"/>
  <circle cx="759.5" cy="230.5" r="1.4" fill="#ffffff"/>

  <!-- Pouch (red-orange, hangs under the bill) and the pale yellow bill -->
  <path d="M776 250C786 302 812 340 852 340C892 340 910 312 906 276C870 282 820 266 776 250Z" fill="#d8532c" stroke="#8e2e14" stroke-width="1.5"/>
  <path d="M772 228C840 238 900 252 962 272C968 275 966 282 958 280C900 270 840 258 772 248Z" fill="#e9dd8d" stroke="#7b6b2e" stroke-width="1.5"/>
  <path d="M774 240L958 276" fill="none" stroke="#7b6b2e" stroke-width="1.2"/>

  <!-- Near leg (thigh and shin) pushing the front pedal, then the webbed foot on the pedal -->
  <path d="M500 436L583 520" stroke="#4a2f20" stroke-width="26" stroke-linecap="round"/>
  <path d="M583 520L598 600" stroke="#3d3a36" stroke-width="11" stroke-linecap="round"/>
  <path d="M588 594L648 602Q656 606 650 610L640 610Q646 612 642 614L630 614Q632 616 626 616L612 614L594 612Q586 606 588 594Z" fill="#3d3d3d" stroke="#1d1d1d" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
