<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voxel Autumn Forest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eccb93; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity 0.3s; }
  #panel { background: rgba(43, 26, 12, 0.6); color: #fff3dc; padding: 18px 26px; border-radius: 12px; text-align: center; line-height: 1.6; max-width: 440px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
  #panel h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: 0.4px; }
  #panel p { margin: 0; font-size: 13px; opacity: 0.9; }
  kbd { background: rgba(255, 255, 255, 0.16); padding: 1px 6px; border-radius: 4px; font: inherit; font-size: 12px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="panel">
    <h1>Autumn Voxel Forest</h1>
    <p>Click to step into the woods</p>
    <p><kbd>W A S D</kbd> move &middot; <kbd>Mouse</kbd> look &middot; <kbd>Space</kbd> jump &middot; <kbd>Shift</kbd> run &middot; <kbd>Esc</kbd> pause</p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   Settings
   ========================================================================= */
const CS = 16;                 // chunk width & depth (voxels)
const H = 48;                  // world height (voxels)
const PAD = 4;                 // generation margin: tree canopies + AO neighbours
const BW = CS + PAD * 2;       // generation buffer width
const SEA_LEVEL = 13;          // terrain below this is filled with water
const CELL = 5;                // one tree / bush / rock candidate per 5x5 cell
const VIEW_R = 6;              // chunks kept loaded around the player
const GRAVITY = 26;
const JUMP_V = 8.4;
const PLAYER_R = 0.3;
const PLAYER_H = 1.75;
const EYE_H = 1.6;
const LEAF_COUNT = 1500;
const LEAF_RANGE = 26;
const FOG_HEX = 0xeccb93;
const SUN_DIR = new THREE.Vector3(0.55, 0.62, -0.5).normalize();

/* =========================================================================
   Blocks & colours
   ========================================================================= */
const AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, SAND = 4, WATER = 5, TRUNK = 6, PINE = 7;
const LEAF_RED = 8, LEAF_ORANGE = 9, LEAF_YELLOW = 10, LEAF_AMBER = 11, LEAF_GREEN = 12, LEAF_BROWN = 13;

const BLOCK_HEX = [
  0x000000, // AIR
  0x8a9a3c, // GRASS
  0x6b4a2d, // DIRT
  0x7c7872, // STONE
  0xd8c48d, // SAND
  0x3d7fb8, // WATER
  0x5a3a22, // TRUNK
  0x2d5b37, // PINE
  0xb8341d, // LEAF_RED
  0xe0671a, // LEAF_ORANGE
  0xf1b437, // LEAF_YELLOW
  0xd4861e, // LEAF_AMBER
  0x6e8a2e, // LEAF_GREEN
  0x87552b, // LEAF_BROWN
];
// Vertex colours are used in linear space, so THREE.Color converts from sRGB hex once here.
const BLOCK_RGB = BLOCK_HEX.map((hex) => new THREE.Color(hex));
const GRASS_SIDE_RGB = BLOCK_RGB[GRASS].clone().lerp(BLOCK_RGB[DIRT], 0.5);

// Each tree picks one mix; every leaf voxel then takes a random colour from that mix.
const LEAF_PALETTES = [
  [LEAF_RED, LEAF_ORANGE, LEAF_YELLOW],
  [LEAF_ORANGE, LEAF_AMBER, LEAF_YELLOW],
  [LEAF_RED, LEAF_AMBER, LEAF_GREEN],
  [LEAF_YELLOW, LEAF_GREEN, LEAF_AMBER],
  [LEAF_BROWN, LEAF_AMBER, LEAF_RED],
  [LEAF_ORANGE, LEAF_RED, LEAF_BROWN],
];

// Face table. u × v = n, so each quad winds counter-clockwise when seen from outside.
const FACES = [
  { n: [1, 0, 0],  u: [0, 1, 0], v: [0, 0, 1] },
  { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },
  { n: [0, 1, 0],  u: [0, 0, 1], v: [1, 0, 0] },
  { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { n: [0, 0, 1],  u: [1, 0, 0], v: [0, 1, 0] },
  { n: [0, 0, -1], u: [0, 1, 0], v: [1, 0, 0] },
];
const AO_LIGHT = [0.42, 0.62, 0.8, 1.0];   // brightness for 0..3 occluders at a vertex

/* =========================================================================
   Hashing & noise. Pure functions, so the same coordinates always produce
   the same world no matter which chunk asks.
   ========================================================================= */
function hash3(x, y, z) {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, 0, zi), b = hash3(xi + 1, 0, zi);
  const c = hash3(xi, 0, zi + 1), d = hash3(xi + 1, 0, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, z) {
  let sum = 0, amp = 0.5, norm = 0, f = 1;
  for (let i = 0; i < 4; i++) {
    sum += amp * valueNoise(x * f, z * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return sum / norm;
}

// Integer terrain height: rolling hills, with low spots that become ponds.
function heightAt(x, z) {
  const n = fbm(x * 0.016 + 1000, z * 0.016 - 1000);
  const d = valueNoise(x * 0.11, z * 0.11);
  return Math.floor(11 + n * 15 + d * 2);
}

// 0..1 forest coverage, so there are clearings as well as dense woods.
function forestDensity(x, z) {
  const f = valueNoise(x * 0.03 + 300, z * 0.03 - 300);
  return Math.min(0.92, Math.max(0, (f - 0.28) * 2.4));
}

/* =========================================================================
   Voxel storage and generation. Each chunk keeps a (CS + 2*PAD)² × H buffer,
   so a tree that straddles a border is stamped identically in every chunk
   it touches.
   ========================================================================= */
const chunks = new Map();
const chunkKey = (cx, cz) => cx * 1000003 + cz;
const idx = (lx, y, lz) => (lx * H + y) * BW + lz;
const isOpaque = (t) => t !== AIR && t !== WATER;
const pick = (list, r) => list[Math.floor(r * list.length)];

function setVoxel(data, ox, oz, x, y, z, type, onlyAir) {
  const lx = x - ox, lz = z - oz;
  if (lx < 0 || lz < 0 || lx >= BW || lz >= BW || y < 0 || y >= H) return;
  const i = idx(lx, y, lz);
  if (onlyAir && data[i] !== AIR) return;
  data[i] = type;
}

function stampTree(data, ox, oz, tx, h, tz, R) {
  if (R(7) < 0.4) {
    // Pine: stacked discs that shrink towards the top
    const trunkH = 6 + Math.floor(R(8) * 4);
    const top = h + trunkH + 2;
    for (let y = h; y < h + trunkH; y++) setVoxel(data, ox, oz, tx, y, tz, TRUNK, false);
    for (let y = h + 2; y <= top; y++) {
      const r = 0.6 + ((top - y) / (top - h - 2)) * 2.6;
      for (let dx = -3; dx <= 3; dx++)
        for (let dz = -3; dz <= 3; dz++)
          if (dx * dx + dz * dz <= r * r + 0.3)
            setVoxel(data, ox, oz, tx + dx, y, tz + dz, PINE, true);
    }
  } else {
    // Broadleaf: a lumpy ellipsoid of autumn foliage on a short trunk
    const trunkH = 4 + Math.floor(R(8) * 3);
    const rxz = 2.4 + R(9) * 0.8, ry = 2.2 + R(10) * 0.8;
    const pal = LEAF_PALETTES[Math.floor(R(11) * LEAF_PALETTES.length)];
    const cy = h + trunkH;
    for (let y = h; y < cy; y++) setVoxel(data, ox, oz, tx, y, tz, TRUNK, false);
    for (let dy = -4; dy <= 4; dy++)
      for (let dx = -4; dx <= 4; dx++)
        for (let dz = -4; dz <= 4; dz++) {
          const d = (dx * dx + dz * dz) / (rxz * rxz) + (dy * dy) / (ry * ry);
          if (d > 1.25) continue;
          const x = tx + dx, y = cy + dy, z = tz + dz;
          if (d < 1 + (hash3(x, y, z) - 0.5) * 0.5)
            setVoxel(data, ox, oz, x, y, z, pick(pal, hash3(x, y + 91, z)), true);
        }
  }
}

function stampBush(data, ox, oz, tx, h, tz, R) {
  const pal = LEAF_PALETTES[Math.floor(R(12) * LEAF_PALETTES.length)];
  for (let dy = 0; dy <= 1; dy++)
    for (let dx = -2; dx <= 2; dx++)
      for (let dz = -2; dz <= 2; dz++) {
        const x = tx + dx, y = h + dy, z = tz + dz;
        if (dx * dx + dz * dz + dy * 1.5 < 3.2 + (hash3(x, y, z) - 0.5) * 2)
          setVoxel(data, ox, oz, x, y, z, pick(pal, hash3(x, y + 91, z)), true);
      }
}

function stampRock(data, ox, oz, tx, h, tz) {
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++) {
      // Chip some corners off so it reads as a stone rather than a cube
      if (Math.abs(dx) + Math.abs(dz) === 2 && hash3(tx + dx, h, tz + dz) < 0.5) continue;
      setVoxel(data, ox, oz, tx + dx, h, tz + dz, STONE, true);
    }
  setVoxel(data, ox, oz, tx, h + 1, tz, STONE, true);
}

function stampCell(data, ox, oz, gx, gz) {
  const R = (s) => hash3(gx, gz, s);
  const tx = gx * CELL + Math.floor(R(1) * CELL);
  const tz = gz * CELL + Math.floor(R(2) * CELL);
  if (Math.abs(tx) < 9 && Math.abs(tz) < 9) return;   // clearing around the spawn point
  const h = heightAt(tx, tz);
  if (h < SEA_LEVEL + 2) return;                       // no trees on beaches or in water
  if (R(3) < forestDensity(tx, tz)) stampTree(data, ox, oz, tx, h, tz, R);
  else if (R(4) < 0.3) stampBush(data, ox, oz, tx, h, tz, R);
  else if (R(5) < 0.06) stampRock(data, ox, oz, tx, h, tz);
}

function generateChunk(cx, cz) {
  const data = new Uint8Array(BW * H * BW);
  const ox = cx * CS - PAD, oz = cz * CS - PAD;

  // Terrain columns
  for (let lx = 0; lx < BW; lx++) {
    for (let lz = 0; lz < BW; lz++) {
      const h = heightAt(ox + lx, oz + lz);
      for (let y = 0; y < h; y++) {
        if (y === h - 1) data[idx(lx, y, lz)] = h <= SEA_LEVEL + 1 ? SAND : GRASS;
        else data[idx(lx, y, lz)] = y >= h - 4 ? DIRT : STONE;
      }
      for (let y = h; y < SEA_LEVEL; y++) data[idx(lx, y, lz)] = WATER;
    }
  }

  // Decorations from every grid cell whose objects could reach this buffer
  const g0x = Math.floor((ox - 9) / CELL), g1x = Math.floor((ox + BW + 9) / CELL);
  const g0z = Math.floor((oz - 9) / CELL), g1z = Math.floor((oz + BW + 9) / CELL);
  for (let gx = g0x; gx <= g1x; gx++)
    for (let gz = g0z; gz <= g1z; gz++) stampCell(data, ox, oz, gx, gz);

  return data;
}

/* =========================================================================
   Chunk meshing: only faces next to a see-through block are emitted, with
   per-vertex ambient occlusion baked into the vertex colours.
   ========================================================================= */
function buildChunkMesh(chunk) {
  const d = chunk.data;
  const ox = chunk.cx * CS, oz = chunk.cz * CS;
  const solid = { pos: [], nrm: [], col: [], index: [] };
  const water = { pos: [], nrm: [], col: [], index: [] };
  const at = (lx, y, lz) => (y < 0 ? STONE : y >= H ? AIR : d[idx(lx, y, lz)]);
  const occ = (lx, y, lz) => (isOpaque(at(lx, y, lz)) ? 1 : 0);

  for (let lx = PAD; lx < PAD + CS; lx++) {
    for (let y = 0; y < H; y++) {
      for (let lz = PAD; lz < PAD + CS; lz++) {
        const t = d[idx(lx, y, lz)];
        if (t === AIR) continue;
        const out = t === WATER ? water : solid;
        const jitter = 0.92 + 0.16 * hash3(ox + lx - PAD, y, oz + lz - PAD);

        for (const F of FACES) {
          const [nx, ny, nz] = F.n;
          const nb = at(lx + nx, y + ny, lz + nz);
          // Water is only seen against air; solids are seen against anything see-through
          if (t === WATER ? nb !== AIR : isOpaque(nb)) continue;

          const [ux, uy, uz] = F.u;
          const [vx, vy, vz] = F.v;
          const c = t === GRASS && ny !== 1 ? GRASS_SIDE_RGB : BLOCK_RGB[t];
          const base = out.pos.length / 3;
          const ao = [0, 0, 0, 0];

          for (let k = 0; k < 4; k++) {
            const su = k === 0 || k === 3 ? -1 : 1;
            const sv = k < 2 ? -1 : 1;
            const s1 = occ(lx + nx + su * ux, y + ny + su * uy, lz + nz + su * uz);
            const s2 = occ(lx + nx + sv * vx, y + ny + sv * vy, lz + nz + sv * vz);
            const s3 = occ(lx + nx + su * ux + sv * vx, y + ny + su * uy + sv * vy, lz + nz + su * uz + sv * vz);
            ao[k] = s1 && s2 ? 0 : 3 - (s1 + s2 + s3);

            const shade = AO_LIGHT[ao[k]] * jitter;
            out.pos.push(
              lx - PAD + 0.5 + nx * 0.5 + (su * ux + sv * vx) * 0.5,
              y + 0.5 + ny * 0.5 + (su * uy + sv * vy) * 0.5,
              lz - PAD + 0.5 + nz * 0.5 + (su * uz + sv * vz) * 0.5
            );
            out.nrm.push(nx, ny, nz);
            out.col.push(c.r * shade, c.g * shade, c.b * shade);
          }

          // Split along the diagonal that avoids AO artefacts
          if (ao[0] + ao[2] < ao[1] + ao[3]) out.index.push(base, base + 1, base + 3, base + 1, base + 2, base + 3);
          else out.index.push(base, base + 1, base + 2, base, base + 2, base + 3);
        }
      }
    }
  }

  const make = (g) => {
    if (!g.index.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(g.nrm, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(g.col, 3));
    geo.setIndex(g.index);
    return geo;
  };
  const solidGeo = make(solid), waterGeo = make(water);
  if (solidGeo) {
    chunk.mesh = new THREE.Mesh(solidGeo, solidMat);
    chunk.mesh.castShadow = true;
    chunk.mesh.receiveShadow = true;
  }
  if (waterGeo) chunk.water = new THREE.Mesh(waterGeo, waterMat);
  for (const m of [chunk.mesh, chunk.water]) {
    if (!m) continue;
    m.position.set(ox, 0, oz);
    scene.add(m);
  }
}

function loadChunk(cx, cz) {
  const chunk = { cx, cz, data: generateChunk(cx, cz), mesh: null, water: null };
  chunks.set(chunkKey(cx, cz), chunk);
  buildChunkMesh(chunk);
}

function unloadChunk(chunk) {
  for (const m of [chunk.mesh, chunk.water]) {
    if (!m) continue;
    scene.remove(m);
    m.geometry.dispose();
  }
  chunks.delete(chunkKey(chunk.cx, chunk.cz));
}

// Keep chunks near the player loaded, build nearest-first within a per-frame time budget.
function streamChunks(budgetMs) {
  const pcx = Math.floor(player.x / CS), pcz = Math.floor(player.z / CS);
  for (const c of chunks.values()) {
    if (Math.abs(c.cx - pcx) > VIEW_R + 1 || Math.abs(c.cz - pcz) > VIEW_R + 1) unloadChunk(c);
  }
  const missing = [];
  for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
    for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
      const cx = pcx + dx, cz = pcz + dz;
      if (!chunks.has(chunkKey(cx, cz))) missing.push([dx * dx + dz * dz, cx, cz]);
    }
  }
  missing.sort((a, b) => a[0] - b[0]);
  const t0 = performance.now();
  for (const [, cx, cz] of missing) {
    loadChunk(cx, cz);
    if (performance.now() - t0 > budgetMs) break;
  }
}

/* =========================================================================
   Renderer, scene, lights, sky
   ========================================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_HEX, 42, 104);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';

const hemi = new THREE.HemisphereLight(0xfff1d6, 0x5a4026, 2.0);
scene.add(hemi);

const SH = 34;   // shadow frustum half-size, centred on the player
const sun = new THREE.DirectionalLight(0xffdca8, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 170 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const solidMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const waterMat = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.8 });

const srgb = (hex) => new THREE.Vector3(((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255);
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      zenith: { value: srgb(0x5b8fcf) },
      horizon: { value: srgb(FOG_HEX) },
      sunDir: { value: SUN_DIR },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 zenith;
      uniform vec3 horizon;
      uniform vec3 sunDir;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        vec3 col = mix(horizon, zenith, pow(clamp(d.y, 0.0, 1.0), 0.6));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += vec3(1.0, 0.9, 0.6) * (pow(s, 256.0) * 1.2 + pow(s, 12.0) * 0.18);
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

/* =========================================================================
   Player & collision: axis-separated box against voxels, with 1-block step-up
   ========================================================================= */
function getBlock(x, y, z) {
  x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
  if (y < 0) return STONE;
  if (y >= H) return AIR;
  const cx = Math.floor(x / CS), cz = Math.floor(z / CS);
  const c = chunks.get(chunkKey(cx, cz));
  if (!c) {
    // Chunk not generated yet: use bare terrain so nothing falls through the world
    const h = heightAt(x, z);
    return y < h ? STONE : y < SEA_LEVEL ? WATER : AIR;
  }
  return c.data[idx(x - cx * CS + PAD, y, z - cz * CS + PAD)];
}

function collides(x, y, z) {
  const x0 = Math.floor(x - PLAYER_R), x1 = Math.floor(x + PLAYER_R - 1e-6);
  const y0 = Math.floor(y), y1 = Math.floor(y + PLAYER_H - 1e-6);
  const z0 = Math.floor(z - PLAYER_R), z1 = Math.floor(z + PLAYER_R - 1e-6);
  for (let i = x0; i <= x1; i++)
    for (let j = y0; j <= y1; j++)
      for (let k = z0; k <= z1; k++)
        if (isOpaque(getBlock(i, j, k))) return true;
  return false;
}

const player = { x: 0.5, y: heightAt(0, 0) + 3, z: 0.5, vy: 0, grounded: false };

function updatePlayer(dt, mx, mz, speed, jump) {
  const nx = player.x + mx * speed * dt;
  if (!collides(nx, player.y, player.z)) player.x = nx;
  else if (player.grounded && !collides(nx, player.y + 1, player.z)) { player.x = nx; player.y += 1; }

  const nz = player.z + mz * speed * dt;
  if (!collides(player.x, player.y, nz)) player.z = nz;
  else if (player.grounded && !collides(player.x, player.y + 1, nz)) { player.z = nz; player.y += 1; }

  player.vy = Math.max(player.vy - GRAVITY * dt, -30);
  const ny = player.y + player.vy * dt;
  if (collides(player.x, ny, player.z)) {
    if (player.vy < 0) player.y = Math.floor(ny) + 1;   // land on top of the block
    player.vy = 0;
  } else {
    player.y = ny;
  }

  player.grounded = collides(player.x, player.y - 0.05, player.z);
  if (jump && player.grounded) {
    player.vy = JUMP_V;
    player.grounded = false;
  }
}

/* =========================================================================
   Falling autumn leaves: a box of tumbling leaf quads that follows the player
   ========================================================================= */
const leafGeo = new THREE.BoxGeometry(0.26, 0.04, 0.26);
const leafMat = new THREE.MeshLambertMaterial();
const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, LEAF_COUNT);
leafMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
leafMesh.castShadow = true;
leafMesh.frustumCulled = false;
scene.add(leafMesh);

const leafTints = [LEAF_RED, LEAF_ORANGE, LEAF_YELLOW, LEAF_AMBER, LEAF_BROWN, LEAF_GREEN].map((t) => BLOCK_RGB[t]);
const leaves = [];
const dummy = new THREE.Object3D();

function respawnLeaf(l, initial) {
  l.x = player.x + (Math.random() * 2 - 1) * LEAF_RANGE;
  l.z = player.z + (Math.random() * 2 - 1) * LEAF_RANGE;
  l.y = player.y + (initial ? Math.random() * 22 : 12 + Math.random() * 10);
  l.fall = 0.8 + Math.random() * 0.8;
  l.amp = 0.5 + Math.random() * 0.9;
  l.freq = 0.5 + Math.random() * 1.1;
  l.phase = Math.random() * Math.PI * 2;
  l.spin = (Math.random() * 2 - 1) * 2.5;
}

for (let i = 0; i < LEAF_COUNT; i++) {
  const l = {};
  respawnLeaf(l, true);
  leaves.push(l);
  leafMesh.setColorAt(i, leafTints[Math.floor(Math.random() * leafTints.length)]);
}
leafMesh.instanceColor.needsUpdate = true;

function updateLeaves(dt, time) {
  const windX = 0.7 + 0.5 * Math.sin(time * 0.05);
  const windZ = 0.4 * Math.sin(time * 0.037 + 1.3);
  for (let i = 0; i < LEAF_COUNT; i++) {
    const l = leaves[i];
    l.y -= l.fall * dt;
    l.x += (windX + Math.cos(time * l.freq + l.phase) * l.amp) * dt;
    l.z += (windZ + Math.sin(time * l.freq * 0.8 + l.phase) * l.amp * 0.6) * dt;

    // Recycle leaves that drift out of range, sink too far, or land on a solid block
    if (
      Math.abs(l.x - player.x) > LEAF_RANGE ||
      Math.abs(l.z - player.z) > LEAF_RANGE ||
      l.y < player.y - 25 ||
      isOpaque(getBlock(l.x, l.y, l.z))
    ) respawnLeaf(l, false);

    dummy.position.set(l.x, l.y, l.z);
    dummy.rotation.set(
      Math.sin(time * l.freq + l.phase) * 0.9,
      time * l.spin,
      Math.cos(time * l.freq * 0.7 + l.phase) * 0.9
    );
    dummy.updateMatrix();
    leafMesh.setMatrixAt(i, dummy.matrix);
  }
  leafMesh.instanceMatrix.needsUpdate = true;
}

/* =========================================================================
   Input & pointer lock
   ========================================================================= */
let yaw = 0, pitch = -0.12;
const keys = {};
const hud = document.getElementById('hud');
const canvas = renderer.domElement;

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

canvas.addEventListener('click', () => canvas.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  hud.style.opacity = document.pointerLockElement === canvas ? '0' : '1';
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0022));
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   Main loop
   ========================================================================= */
let camY = player.y + EYE_H;
let bobPhase = 0, bob = 0;
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const time = now / 1000;

  // Walk direction in world space, derived from the yaw
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let mx = -Math.sin(yaw) * fwd + Math.cos(yaw) * side;
  let mz = -Math.cos(yaw) * fwd - Math.sin(yaw) * side;
  const len = Math.hypot(mx, mz);
  if (len > 0) { mx /= len; mz /= len; }
  const speed = keys.ShiftLeft || keys.ShiftRight ? 7.5 : 4.2;

  updatePlayer(dt, mx, mz, speed, !!keys.Space);

  // Camera: eye height, head bob while walking, smoothed so step-ups don't snap
  const walking = len > 0 && player.grounded;
  if (walking) bobPhase += dt * speed * 2.2;
  const bobTarget = walking ? Math.sin(bobPhase) * 0.035 * (speed / 4.2) : 0;
  bob += (bobTarget - bob) * Math.min(1, dt * 8);
  camY += (player.y + EYE_H + bob - camY) * Math.min(1, dt * 14);
  camera.position.set(player.x, camY, player.z);
  camera.rotation.set(pitch, yaw, 0);

  streamChunks(6);
  updateLeaves(dt, time);

  // Sun follows the player; snapping to shadow texels stops shadows from shimmering
  const texel = (SH * 2) / 2048;
  const tx = Math.round(player.x / texel) * texel;
  const ty = Math.round(player.y / texel) * texel;
  const tz = Math.round(player.z / texel) * texel;
  sun.target.position.set(tx, ty, tz);
  sun.position.set(tx + SUN_DIR.x * 70, ty + SUN_DIR.y * 70, tz + SUN_DIR.z * 70);
  sky.position.copy(camera.position);

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(frame);
</script>
