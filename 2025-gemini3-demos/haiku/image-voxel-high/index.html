<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sakura Sky Isle · Voxel Art</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eadcd8; }
  canvas { display: block; }
  #title {
    position: fixed; left: 28px; bottom: 22px;
    font: 500 16px/1.4 Georgia, "Times New Roman", serif;
    color: #6b5763; letter-spacing: .06em;
    text-shadow: 0 1px 8px rgba(255, 255, 255, .8);
    pointer-events: none; user-select: none;
  }
  #title span {
    display: block; margin-top: 4px;
    font: 400 10px/1 system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; opacity: .7;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">Sakura Sky Isle<span>voxel diorama · drag to orbit</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- seeded randomness & noise ---------------- */
let seed = 20261031;
function rand() {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (a) => a[Math.floor(rand() * a.length)];

function hash2(x, y) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul((y | 0) + 1337, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 3) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return s / norm;
}

/* ---------------- palette (sampled from the reference mood) ---------------- */
const GRASS      = [0x88bb52, 0x78ab45, 0x9bcb5e, 0x6c9e40];
const MOSS       = [0x4f7f36, 0x5d8e3c, 0x3f6e2e];
const ROCK       = [0x776a5e, 0x6c6058, 0x8a7d6f, 0x5e544d];
const ROCK_LIGHT = [0xa39585, 0x9a8f7f, 0xb3a894];
const DIRT       = [0x7f6a52, 0x6e5b47];
const STONE      = [0xcdc5b5, 0xbab1a1, 0xd8d0c0, 0xaaa191];
const BARK       = [0x5b4032, 0x6e4e3c, 0x47322a, 0x7a5a45];
const PINK_LIGHT = [0xffe2eb, 0xffd3e0, 0xfff1f6];
const PINK_MID   = [0xfbb4c9, 0xf7a3bd, 0xffc4d6, 0xf597b5];
const PINK_DEEP  = [0xe68aa7, 0xd67b9b, 0xf09ab4];
const VINE       = [0x6fae4a, 0x5a9a3c, 0x8bc65f, 0x4c8a36];
const FALLEN     = [0xffc7d9, 0xf9b4ca];
const FLOWER     = [0xffffff, 0xffeaf2];
const PETAL_COLS = [0xffd5e2, 0xffb9cd, 0xf9a5be, 0xffe6ee];
const HILL_LOW   = [0x84a06a, 0x73905b, 0x91a772];
const HILL_HIGH  = [0x9d978a, 0x8e887b, 0xaba496];
const WATER_COLS = [0xeaf9ff, 0xd3eff9, 0xffffff, 0xc2e8f4];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* ---------------- voxel store (first write wins unless forced) ---------------- */
const voxels = new Map();
const vkey = (x, y, z) => `${x},${y},${z}`;
function put(x, y, z, c, force = false) {
  const k = vkey(x, y, z);
  if (force || !voxels.has(k)) voxels.set(k, { x, y, z, c });
}
const has = (x, y, z) => voxels.has(vkey(x, y, z));

/* ---------------- floating island ---------------- */
const ISL = { rx: 22, rz: 19 };
const colKey = (x, z) => `${x}|${z}`;
const cols = new Map();
for (let x = -ISL.rx - 2; x <= ISL.rx + 2; x++) {
  for (let z = -ISL.rz - 2; z <= ISL.rz + 2; z++) {
    const n = fbm(x * 0.16, z * 0.16, 4);
    const d = Math.hypot(x / ISL.rx, z / ISL.rz) + (n - 0.5) * 0.45;
    if (d >= 1) continue;
    const edge = 1 - d;
    const top = Math.round(2 + edge * 2.4 + (fbm(x * 0.22 + 31, z * 0.22, 3) - 0.5) * 2.6);
    const depth = Math.round(3 + 19 * Math.pow(edge, 0.55) + (hash2(x * 7, z * 7) - 0.5) * 4);
    cols.set(colKey(x, z), { x, z, top, bottom: top - Math.max(2, depth), edge });
  }
}
const surfaceAt = (x, z) => cols.get(colKey(x, z))?.top ?? -Infinity;
const colArr = [...cols.values()];

for (const c of colArr) {
  for (let y = c.bottom; y <= c.top; y++) {
    const fromTop = c.top - y;
    let col;
    if (fromTop === 0) col = c.edge < 0.07 ? pick(ROCK) : (rand() < 0.2 ? pick(MOSS) : pick(GRASS));
    else if (fromTop === 1) col = rand() < 0.6 ? pick(DIRT) : pick(ROCK);
    else col = rand() < 0.25 ? pick(ROCK_LIGHT) : pick(ROCK);

    const exposed = DIRS.some(([dx, dz]) => {
      const n = cols.get(colKey(c.x + dx, c.z + dz));
      return !n || n.top < y || n.bottom > y;
    });
    if (exposed && fromTop <= 3 && rand() < 0.55) col = pick(MOSS);
    put(c.x, y, c.z, col);
  }
}

/* grass tufts, fallen petals and a few flowers on the lawn */
for (const c of colArr) {
  if (c.edge < 0.03) continue;
  const r = rand();
  if (r < 0.07) put(c.x, c.top + 1, c.z, pick(GRASS));
  else if (r < 0.085) put(c.x, c.top + 1, c.z, pick(FALLEN));
  else if (r < 0.09) put(c.x, c.top + 1, c.z, pick(FLOWER));
}

/* ---------------- voxel helpers ---------------- */
function blob(cx, cy, cz, r, colorAt, { jitter = 0.5, force = false } = {}) {
  const ix = Math.round(cx), iy = Math.round(cy), iz = Math.round(cz);
  const R = Math.ceil(r + jitter);
  for (let dx = -R; dx <= R; dx++)
    for (let dy = -R; dy <= R; dy++)
      for (let dz = -R; dz <= R; dz++) {
        if (Math.hypot(dx, dy, dz) > r + (rand() * 2 - 1) * jitter) continue;
        const x = ix + dx, y = iy + dy, z = iz + dz;
        if (y <= surfaceAt(x, z)) continue;
        const c = colorAt(dx, dy, dz);
        if (c != null) put(x, y, z, c, force);
      }
}

/* ---------------- ancient stone pillars ---------------- */
function ruin(x, z, h) {
  const corners = [[x, z], [x + 1, z], [x, z + 1], [x + 1, z + 1]];
  if (!corners.every(([a, b]) => cols.has(colKey(a, b)))) return;
  const base = Math.max(...corners.map(([a, b]) => surfaceAt(a, b)));
  for (let dx = 0; dx < 2; dx++)
    for (let dz = 0; dz < 2; dz++)
      for (let y = base + 1; y <= base + h; y++) {
        if (y >= base + h - 1 && rand() < 0.45) continue;
        put(x + dx, y, z + dz, y <= base + 2 && rand() < 0.5 ? pick(MOSS) : pick(STONE), true);
      }
}
ruin(-10, -1, 7);
ruin(8, -2, 5);

/* boulders resting on the lawn */
const edgeCols = colArr.filter((c) => c.edge > 0.25 && c.edge < 0.9);
for (let i = 0; i < 14; i++) {
  const c = pick(edgeCols);
  blob(c.x, c.top + 1, c.z, 0.9 + rand() * 0.9, () => (rand() < 0.5 ? pick(ROCK) : pick(ROCK_LIGHT)), { jitter: 0.4, force: true });
}

/* ---------------- sakura tree ---------------- */
const TREE = { x: -1, z: -4 };
const tTop = surfaceAt(TREE.x, TREE.z);
const tips = [];
const leafColor = (dx, dy) => {
  if (rand() < 0.1) return null;
  if (dy < -1) return pick(PINK_DEEP);
  if (dy > 1) return pick(PINK_LIGHT);
  return pick(PINK_MID);
};

function branch(x, y, z, dx, dy, dz, len, rad, depth) {
  const n = Math.max(2, Math.round(len));
  for (let i = 0; i < n; i++) {
    x += dx; y += dy; z += dz;
    dx += (rand() - 0.5) * 0.4;
    dy += (rand() - 0.5) * 0.2 + 0.05;
    dz += (rand() - 0.5) * 0.4;
    const l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;
    const r = Math.max(0.7, rad * (1 - 0.4 * (i / n)));
    blob(x, y, z, r, () => pick(BARK), { jitter: 0.3, force: true });
  }
  if (depth === 0) {
    tips.push({ x, y, z, r: 3.2 + rand() * 1.4 });
    return;
  }
  if (depth === 1) tips.push({ x, y, z, r: 2.6 + rand() * 0.8 });

  const kids = rand() < 0.5 ? 2 : 3;
  for (let k = 0; k < kids; k++) {
    const a = rand() * Math.PI * 2;
    const s = 0.55 + rand() * 0.35;
    let ndx = dx + Math.cos(a) * s;
    let ndy = dy * 0.6 + 0.35 + rand() * 0.25;
    let ndz = dz + Math.sin(a) * s;
    const nl = Math.hypot(ndx, ndy, ndz);
    branch(x, y, z, ndx / nl, ndy / nl, ndz / nl, len * (0.6 + rand() * 0.2), rad * 0.65, depth - 1);
  }
}
branch(TREE.x, tTop + 1, TREE.z, 0.1, 1, 0.1, 6.5, 2.4, 3);
for (const t of tips) blob(t.x, t.y, t.z, t.r, leafColor, { jitter: 1.0 });

/* ---------------- moss vines dripping off the cliff ---------------- */
for (const c of colArr) {
  if (c.edge > 0.3) continue;
  for (const [dx, dz] of DIRS) {
    if (cols.has(colKey(c.x + dx, c.z + dz)) || rand() > 0.25) continue;
    const len = 3 + Math.floor(rand() * 10);
    const vx = c.x + dx, vz = c.z + dz;
    for (let i = 0; i < len; i++) {
      if (i > 1 && rand() < 0.12) break;
      const y = c.top - i;
      if (has(vx, y, vz)) break;
      put(vx, y, vz, pick(VINE));
    }
  }
}

/* ---------------- waterfall source ---------------- */
let wcol = null;
for (const c of colArr) if (c.x === 0 && (!wcol || c.z > wcol.z)) wcol = c;
const WF = {
  top: wcol.top,
  z: wcol.z,
  L: wcol.top - wcol.bottom + 26,
  speed: 6,
};

/* ---------------- drifting rocks beneath the island ---------------- */
for (let i = 0; i < 8; i++) {
  const a = rand() * Math.PI * 2;
  const dist = 26 + rand() * 10;
  const cx = Math.cos(a) * dist;
  const cz = Math.sin(a) * dist * 0.85;
  const cy = -6 - rand() * 14;
  const r = 1.6 + rand() * 1.6;
  blob(cx, cy, cz, r, (dx, dy) => (dy > r * 0.35 ? pick(GRASS) : pick(ROCK)), { jitter: 0.5 });
}

/* ---------------- distant voxel ridge (lower right of the frame) ---------------- */
const HILL = { w: 28, d: 14, s: 2.6, base: -18 };
const hillMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial(), HILL.w * HILL.d);
hillMesh.receiveShadow = true;

/* ---------------- build the voxel meshes ---------------- */
const dummy = new THREE.Object3D();
const tint = new THREE.Color();

const voxList = [...voxels.values()];
const voxMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial(), voxList.length);
voxMesh.castShadow = true;
voxMesh.receiveShadow = true;
voxList.forEach((v, i) => {
  dummy.position.set(v.x, v.y, v.z);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.setScalar(0.94);
  dummy.updateMatrix();
  voxMesh.setMatrixAt(i, dummy.matrix);
  voxMesh.setColorAt(i, tint.setHex(v.c).multiplyScalar(0.92 + rand() * 0.14));
});
voxMesh.instanceMatrix.needsUpdate = true;

let hi = 0;
for (let i = 0; i < HILL.w; i++) {
  for (let j = 0; j < HILL.d; j++) {
    const x = 6 + i * HILL.s;
    const z = -50 + j * HILL.s;
    const ridge = fbm(i * 0.3 + 5, j * 0.3, 4);
    const falloff = 1 - Math.min(1, Math.hypot((i - HILL.w / 2) / (HILL.w / 2), (j - HILL.d / 2) / (HILL.d / 2)));
    const h = Math.max(1, Math.round((ridge * 1.5 - 0.3) * 26 * (0.45 + falloff)));
    dummy.position.set(x, HILL.base + h / 2, z);
    dummy.scale.set(HILL.s - 0.1, h, HILL.s - 0.1);
    dummy.updateMatrix();
    hillMesh.setMatrixAt(hi, dummy.matrix);
    hillMesh.setColorAt(hi, tint.setHex(h > 13 ? pick(HILL_HIGH) : pick(HILL_LOW)));
    hi++;
  }
}
hillMesh.instanceMatrix.needsUpdate = true;

/* ---------------- waterfall (animated voxel stream) ---------------- */
const waterCells = [];
for (let ix = 0; ix < 3; ix++) {
  for (let iz = 0; iz < 2; iz++) {
    const phase = rand() * WF.L;
    for (let r = 0; r < WF.L; r++) {
      waterCells.push({ x: wcol.x + (ix - 1), z: WF.z + 1 + iz, row: r, phase, ix });
    }
  }
}
const waterMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshLambertMaterial({
    color: 0xffffff,
    emissive: 0x9fd3e8,
    emissiveIntensity: 0.35,
    transparent: true,
    opacity: 0.88,
    depthWrite: false,
  }),
  waterCells.length
);
waterCells.forEach((c, i) => waterMesh.setColorAt(i, tint.setHex(pick(WATER_COLS))));

function updateWater(t) {
  for (let i = 0; i < waterCells.length; i++) {
    const c = waterCells[i];
    const s = (c.row + c.phase + t * WF.speed) % WF.L;
    const f = Math.max(0.05, Math.min(1, s / 2, (WF.L - s) / 3));
    const wobble = Math.sin(t * 2.2 + c.row * 0.35 + c.ix) * 0.04;
    dummy.position.set(wcol.x + (c.ix - 1) + wobble, WF.top - s, c.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(0.9 * f, 0.9 * f, 0.9 * f);
    dummy.updateMatrix();
    waterMesh.setMatrixAt(i, dummy.matrix);
  }
  waterMesh.instanceMatrix.needsUpdate = true;
}

/* ---------------- sakura petals ---------------- */
const PETAL_N = 260;
const petalMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.42, 0.3),
  new THREE.MeshLambertMaterial({ side: THREE.DoubleSide }),
  PETAL_N
);
const petals = [];
function respawnPetal(p, scatter) {
  p.x = TREE.x + (rand() - 0.5) * 44;
  p.y = scatter ? rand() * 24 - 6 : 20 + rand() * 6;
  p.z = TREE.z + (rand() - 0.5) * 40;
}
for (let i = 0; i < PETAL_N; i++) {
  const p = { x: 0, y: 0, z: 0, ph: rand() * Math.PI * 2, sp: 0.8 + rand() * 0.9 };
  respawnPetal(p, true);
  petals.push(p);
  petalMesh.setColorAt(i, tint.setHex(pick(PETAL_COLS)));
}
function updatePetals(t, dt) {
  for (let i = 0; i < PETAL_N; i++) {
    const p = petals[i];
    p.y -= p.sp * dt;
    p.x += (0.6 + Math.sin(t * 0.5 + p.ph) * 0.5) * dt;
    p.z += Math.cos(t * 0.4 + p.ph) * 0.4 * dt;
    if (p.y < -22) respawnPetal(p, false);
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(t * 1.2 + p.ph, t * 0.8 + p.ph * 2, Math.sin(t + p.ph) * 0.8);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

/* ---------------- soft textures: clouds, glow, sky ---------------- */
function radialTexture(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  draw(g);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const cloudTex = radialTexture((g) => {
  for (let i = 0; i < 16; i++) {
    const x = 128 + (rand() - 0.5) * 130;
    const y = 128 + (rand() - 0.5) * 60;
    const r = 28 + rand() * 52;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(255,255,255,0.9)');
    grd.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
});
const glowTex = radialTexture((g) => {
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,244,228,1)');
  grd.addColorStop(0.35, 'rgba(255,220,226,0.45)');
  grd.addColorStop(1, 'rgba(255,220,226,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
});
const skyTex = (() => {
  // vertical sky gradient used as the scene background
  const c = document.createElement('canvas');
  c.width = 4;
  c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#c4d0ea');
  grd.addColorStop(0.5, '#e6dde8');
  grd.addColorStop(0.8, '#f5e6e1');
  grd.addColorStop(1, '#f2e2da');
  g.fillStyle = grd;
  g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

/* ---------------- scene ---------------- */
const scene = new THREE.Scene();
scene.background = skyTex;
scene.fog = new THREE.Fog(0xf0e0dc, 120, 340);

scene.add(new THREE.HemisphereLight(0xfff3ef, 0x9aa98a, 1.5));
const sun = new THREE.DirectionalLight(0xffd9c2, 2.0);
sun.position.set(-30, 46, -34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 160 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.05;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffeedd, 0.6);
fill.position.set(40, 20, 50);
scene.add(fill);

scene.add(voxMesh, hillMesh, waterMesh, petalMesh);

/* glowing sun behind the canopy */
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9,
}));
glow.position.set(-50, 16, -90);
glow.scale.set(90, 90, 1);
scene.add(glow);

/* waterfall mist */
const mistMat = new THREE.SpriteMaterial({ map: cloudTex, color: 0xffffff, transparent: true, opacity: 0.8, depthWrite: false });
for (let i = 0; i < 6; i++) {
  const m = new THREE.Sprite(mistMat.clone());
  m.position.set((rand() - 0.5) * 6, WF.top - WF.L + 4 + rand() * 6, WF.z + 2 + rand() * 2);
  const s = 9 + rand() * 7;
  m.scale.set(s, s * 0.7, 1);
  scene.add(m);
}

/* drifting cloud sea, kept clear of the island's view corridor */
const clouds = [];
for (let i = 0; i < 90; i++) {
  const x = (rand() - 0.5) * 260;
  const z = (rand() - 0.5) * 260;
  const low = rand() < 0.6;
  const y = low ? -32 - rand() * 22 : -4 + rand() * 34;
  if (Math.hypot(x, z) < 34 && y > -10 && y < 16) continue;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: cloudTex,
    color: pick([0xffffff, 0xfff4f4, 0xf7e6ee, 0xffe9ef]),
    transparent: true,
    opacity: 0.55 + rand() * 0.35,
    depthWrite: false,
  }));
  s.position.set(x, y, z);
  const sc = 40 + rand() * 50;
  s.scale.set(sc, sc * 0.55, 1);
  scene.add(s);
  clouds.push({ s, v: 0.4 + rand() * 0.8 });
}

/* ---------------- renderer, camera, controls ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 800);
camera.position.set(42, 14, 56);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 35;
controls.maxDistance = 150;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => { controls.autoRotate = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- loop ---------------- */
let last = 0;
renderer.setAnimationLoop((ms) => {
  const t = ms / 1000;
  const dt = Math.min(t - last, 0.05);
  last = t;

  updateWater(t);
  updatePetals(t, dt);
  for (const c of clouds) {
    c.s.position.x += c.v * dt;
    if (c.s.position.x > 160) c.s.position.x = -160;
  }

  controls.update();
  renderer.render(scene, camera);
});
</script>
