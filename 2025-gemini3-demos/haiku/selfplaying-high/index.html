<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serpent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 30%, #161d3d 0%, #07081a 70%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8ecff;
    overflow: hidden;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
  #score {
    font-size: 3rem;
    font-weight: 200;
    letter-spacing: 0.05em;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }
  canvas {
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  footer {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.4;
  }
</style>
</head>
<body>
<main>
  <div id="score">0</div>
  <canvas id="board"></canvas>
  <footer>a game that plays itself</footer>
</main>
<script>
  const GRID = 20;
  const TICK_MS = 110;
  const RESTART_MS = 2200;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');

  let size = 0, cell = 0, dpr = 1;
  let snake, prev, food, score, dead, deadAt, endText, acc, last;

  const key = (x, y) => x + y * GRID;
  const inside = (x, y) => x >= 0 && y >= 0 && x < GRID && y < GRID;
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];

  function reset(now) {
    const m = GRID >> 1;
    snake = [[m, m], [m - 1, m], [m - 2, m], [m - 3, m]];
    prev = snake.map(p => [...p]);
    food = spawnFood();
    score = 0;
    dead = false;
    scoreEl.textContent = '0';
    acc = 0;
    last = now;
  }

  function spawnFood() {
    const taken = new Set(snake.map(([x, y]) => key(x, y)));
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!taken.has(key(x, y))) free.push([x, y]);
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // Breadth-first search: how many cells are reachable, and how far to the target.
  function explore(sx, sy, blocked, tx, ty) {
    const seen = new Set([key(sx, sy)]);
    const queue = [[sx, sy, 0]];
    let dist = Infinity;
    for (let i = 0; i < queue.length; i++) {
      const [x, y, d] = queue[i];
      if (dist === Infinity && x === tx && y === ty) dist = d;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy, k = key(nx, ny);
        if (inside(nx, ny) && !blocked.has(k) && !seen.has(k)) {
          seen.add(k);
          queue.push([nx, ny, d + 1]);
        }
      }
    }
    return { area: queue.length, dist };
  }

  function chooseMove() {
    const [hx, hy] = snake[0];
    const body = new Set(snake.slice(0, -1).map(([x, y]) => key(x, y)));
    let best = -1, bestScore = -Infinity;

    for (let d = 0; d < 4; d++) {
      const nx = hx + DIRS[d][0], ny = hy + DIRS[d][1];
      if (!inside(nx, ny) || body.has(key(nx, ny))) continue;

      const eating = nx === food[0] && ny === food[1];
      const after = [[nx, ny], ...(eating ? snake : snake.slice(0, -1))];
      const blocked = new Set(after.slice(0, -1).map(([x, y]) => key(x, y)));
      const tail = after[after.length - 1];

      const toFood = explore(nx, ny, blocked, food[0], food[1]);
      const toTail = explore(nx, ny, blocked, tail[0], tail[1]);
      const safe = toTail.dist < Infinity && toFood.area >= after.length;

      const s = (safe ? 0 : -1e6)
              + (toFood.dist === Infinity ? -1e5 : -toFood.dist * 10)
              + Math.min(toFood.area, 400) * 0.1;
      if (s > bestScore) { bestScore = s; best = d; }
    }
    return best;
  }

  function tick(now) {
    const move = chooseMove();
    prev = snake.map(p => [...p]);

    if (move < 0) {
      dead = true;
      deadAt = now;
      endText = 'Game over';
      return;
    }

    const head = [snake[0][0] + DIRS[move][0], snake[0][1] + DIRS[move][1]];
    snake.unshift(head);

    if (same(head, food)) {
      score++;
      scoreEl.textContent = score;
      food = spawnFood();
      if (!food) {
        dead = true;
        deadAt = now;
        endText = 'Board cleared';
      }
    } else {
      snake.pop();
    }
  }

  function draw(now, t) {
    const n = snake.length;
    const fade = dead ? Math.min(1, (now - deadAt) / 400) : 0;
    const sat = 85 * (1 - fade);
    const inset = cell * 0.1, radius = cell * 0.28, w = cell - inset * 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const bg = ctx.createLinearGradient(0, 0, 0, size);
    bg.addColorStop(0, '#141b38');
    bg.addColorStop(1, '#080a18');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.beginPath();
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++) {
        ctx.moveTo((x + 0.5) * cell + 1.2, (y + 0.5) * cell);
        ctx.arc((x + 0.5) * cell, (y + 0.5) * cell, 1.2, 0, Math.PI * 2);
      }
    ctx.fill();

    if (food) {
      const r = cell * 0.3 * (1 + 0.08 * Math.sin(now / 180));
      ctx.save();
      ctx.shadowColor = '#ff6b9a';
      ctx.shadowBlur = cell * 0.9;
      ctx.fillStyle = '#ff7aa8';
      ctx.beginPath();
      ctx.arc((food[0] + 0.5) * cell, (food[1] + 0.5) * cell, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = n - 1; i >= 0; i--) {
      const [px, py] = snake[i];
      const [ox, oy] = prev[Math.min(i, prev.length - 1)];
      const x = (ox + (px - ox) * t) * cell + inset;
      const y = (oy + (py - oy) * t) * cell + inset;
      const hue = 175 + 115 * (i / (n - 1));
      const color = `hsl(${hue} ${sat}% ${i === 0 ? 72 : 60}%)`;

      ctx.fillStyle = color;
      if (i === 0) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = cell * 0.9;
      }
      ctx.beginPath();
      ctx.roundRect(x, y, w, w, radius);
      ctx.fill();
      if (i === 0) ctx.restore();
    }

    if (dead) {
      ctx.fillStyle = `rgba(6, 8, 20, ${0.55 * fade})`;
      ctx.fillRect(0, 0, size, size);
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#eef1ff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `600 ${size * 0.065}px system-ui, sans-serif`;
      ctx.fillText(endText, size / 2, size / 2 - size * 0.04);
      ctx.font = `400 ${size * 0.035}px system-ui, sans-serif`;
      ctx.fillStyle = 'rgba(232, 236, 255, 0.6)';
      ctx.fillText(`score ${score} · starting over`, size / 2, size / 2 + size * 0.05);
      ctx.globalAlpha = 1;
    }
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    size = Math.floor(Math.max(200, Math.min(innerWidth * 0.92, innerHeight - 170, 560)));
    canvas.style.width = canvas.style.height = size + 'px';
    canvas.width = canvas.height = Math.round(size * dpr);
    cell = size / GRID;
  }

  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;

    if (dead) {
      if (now - deadAt > RESTART_MS) reset(now);
    } else {
      acc += dt;
      if (acc >= TICK_MS) {
        acc -= TICK_MS;
        tick(now);
      }
    }

    draw(now, dead ? 1 : acc / TICK_MS);
    requestAnimationFrame(frame);
  }

  resize();
  addEventListener('resize', resize);
  reset(performance.now());
  requestAnimationFrame(frame);
</script>
</body>
</html>
