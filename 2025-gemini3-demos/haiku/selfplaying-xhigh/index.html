<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong · Self-Play</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #161b27 0%, #080a0f 75%);
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Logical playfield, scaled to fit any window
  const W = 800, H = 500;
  const PAD_W = 10, PAD_H = 84, PAD_INSET = 36, PAD_SPEED = 4.8;
  const BALL_R = 7;
  const SPEED_START = 5.2, SPEED_UP = 1.06, SPEED_MAX = 11;
  const WIN_SCORE = 7;
  const TRAIL = 24;
  const INK = '#e9edf5';
  const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';

  let dpr = 1, scale = 1, ox = 0, oy = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = Math.min(w / W, h / H) * 0.9;
    ox = (w - W * scale) / 2;
    oy = (h - H * scale) / 2;
  }

  const randSide = () => (Math.random() < 0.5 ? -1 : 1);
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);

  const paddles = [
    { x: PAD_INSET, y: H / 2 - PAD_H / 2, target: H / 2, think: 0, flash: 0, pop: 0, score: 0 },
    { x: W - PAD_INSET - PAD_W, y: H / 2 - PAD_H / 2, target: H / 2, think: 0, flash: 0, pop: 0, score: 0 },
  ];
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: SPEED_START, live: false };
  const trail = [];
  let time = 0;
  let serveTo = randSide();   // side the next serve travels toward
  let serveAt = 1;            // time of the next serve
  let winner = -1;

  // Is the ball moving toward paddle i?
  const incoming = (i) => (i === 0 ? ball.vx < 0 : ball.vx > 0);

  function serve() {
    ball.x = W / 2;
    ball.y = rand(140, 360);
    ball.speed = SPEED_START;
    const angle = rand(-0.5, 0.5);
    ball.vx = serveTo * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    ball.live = true;
    trail.length = 0;
  }

  function scorePoint(i) {
    const p = paddles[i];
    p.score++;
    p.pop = 1;
    ball.live = false;
    serveTo = i === 0 ? 1 : -1;   // serve back toward the side that conceded
    serveAt = time + 1;
    if (p.score >= WIN_SCORE) {
      winner = i;
      serveAt = time + 3.5;
    }
  }

  // Where will the ball cross paddle i's face? Accounts for wall bounces.
  function interceptY(i) {
    const faceX = i === 0 ? PAD_INSET + PAD_W : W - PAD_INSET - PAD_W;
    const t = (faceX - ball.x) / ball.vx;
    const lo = BALL_R, range = H - 2 * BALL_R, span = 2 * range;
    let y = (ball.y + ball.vy * t - lo) % span;
    if (y < 0) y += span;
    return lo + (y > range ? span - y : y);
  }

  // The AI: drift idly while the ball goes away; when it comes back,
  // react after a short delay and aim with a little error.
  function think(i, dt) {
    const p = paddles[i];
    if (!ball.live || !incoming(i)) {
      p.target = H / 2 + Math.sin(time * 0.7 + i * 2.3) * 80;
      p.think = rand(0.15, 0.4);
      return;
    }
    p.think -= dt;
    if (p.think <= 0) {
      p.target = interceptY(i) + rand(-0.4, 0.4) * PAD_H;
      p.think = rand(0.25, 0.45);
    }
  }

  function movePaddle(p, step) {
    const center = p.y + PAD_H / 2;
    const max = PAD_SPEED * step;
    const move = Math.max(-max, Math.min(max, p.target - center));
    p.y = Math.max(0, Math.min(H - PAD_H, p.y + move));
  }

  function update(dt) {
    const step = dt * 60;   // physics runs in 60fps frames

    paddles.forEach((p, i) => {
      think(i, dt);
      movePaddle(p, step);
      p.flash = Math.max(0, p.flash - dt * 2.5);
      p.pop = Math.max(0, p.pop - dt * 2.5);
    });

    if (!ball.live) {
      if (time >= serveAt) {
        if (winner >= 0) {
          paddles.forEach((p) => (p.score = 0));
          winner = -1;
          serveTo = randSide();
        }
        serve();
      }
      return;
    }

    ball.x += ball.vx * step;
    ball.y += ball.vy * step;

    if (ball.y < BALL_R) {
      ball.y = 2 * BALL_R - ball.y;
      ball.vy = Math.abs(ball.vy);
    } else if (ball.y > H - BALL_R) {
      ball.y = 2 * (H - BALL_R) - ball.y;
      ball.vy = -Math.abs(ball.vy);
    }

    for (let i = 0; i < 2; i++) {
      const p = paddles[i];
      const touching = ball.x + BALL_R >= p.x && ball.x - BALL_R <= p.x + PAD_W;
      const inReach = ball.y >= p.y - BALL_R && ball.y <= p.y + PAD_H + BALL_R;
      if (!incoming(i) || !touching || !inReach) continue;

      // Where the ball strikes sets the angle: edges send it off steeper
      const offset = Math.max(-1, Math.min(1, (ball.y - p.y - PAD_H / 2) / (PAD_H / 2)));
      const angle = offset * 0.95;
      ball.speed = Math.min(ball.speed * SPEED_UP, SPEED_MAX);
      ball.x = i === 0 ? p.x + PAD_W + BALL_R : p.x - BALL_R;
      ball.vx = (i === 0 ? 1 : -1) * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
      p.flash = 1;
      break;
    }

    if (ball.x + BALL_R < 0) scorePoint(1);
    else if (ball.x - BALL_R > W) scorePoint(0);
    else {
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > TRAIL) trail.shift();
    }
  }

  function draw() {
    const accent = `hsl(${205 + 45 * Math.sin(time * 0.25)}, 90%, 72%)`;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Centre line
    ctx.setLineDash([10, 14]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(233, 237, 245, 0.12)';
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Scores, with a pop when a point is won
    ctx.fillStyle = INK;
    paddles.forEach((p, i) => {
      ctx.globalAlpha = 0.2 + 0.6 * p.pop;
      ctx.font = `600 ${84 * (1 + 0.2 * p.pop)}px ${FONT}`;
      ctx.fillText(String(p.score), W / 2 + (i === 0 ? -130 : 130), 90);
    });
    ctx.globalAlpha = 1;

    if (winner >= 0) {
      ctx.fillStyle = accent;
      ctx.font = `600 40px ${FONT}`;
      ctx.fillText(winner === 0 ? 'Left wins' : 'Right wins', W / 2, H / 2);
    }

    // Paddles glow when they connect
    ctx.fillStyle = INK;
    paddles.forEach((p) => {
      ctx.shadowColor = accent;
      ctx.shadowBlur = 30 * p.flash * dpr * scale;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, PAD_W, PAD_H, 5);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // Ball and its trail
    if (ball.live) {
      trail.forEach((t, i) => {
        const k = (i + 1) / trail.length;
        ctx.globalAlpha = k * 0.3;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(t.x, t.y, BALL_R * k, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 24 * dpr * scale;
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 20));
    last = now;
    time += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
